:root{--surface:#fcfcfb;--text:#0b0b0b;--muted:#52514e;--grid:#e6e5e0;--keep:#2a78d6;--discard:#8f8e89;--gated:#c26a1b;--rejected:#b8433a;--nochange:#b5b4ae;--error:#8e2a8e;--up:#1f7a3d;--down:#b8433a}

body{margin:0;padding:24px 16px;background:var(--surface);color:var(--text);font:14px/1.4 system-ui,sans-serif}
main{max-width:1280px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 16px}
.meta b{color:var(--text);font-weight:600}
code{font:12px ui-monospace,monospace}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:24px}
.card{border:1px solid var(--grid);border-radius:10px;padding:14px 16px;display:flex;gap:16px;align-items:center}
.card svg.graphic{flex:none}
.card > div{min-width:0}
.card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.card .big{font-size:28px;font-weight:600;line-height:1.1}
.card .sub{color:var(--muted);font-size:13px;margin-top:4px}
.card .row{margin-top:4px;font-size:13px}
.card .row svg{vertical-align:-3px;margin-right:6px;color:var(--muted)}
.card .row svg[width="10"]{vertical-align:-1px}
h2{font-size:14px;color:var(--muted);font-weight:600;margin:28px 0 8px}
.chart{width:100%}
.empty{color:var(--muted);padding:32px 16px;text-align:center;border:1px dashed var(--grid);border-radius:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--muted);font-weight:600;text-align:left;font-size:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
.tag{display:inline-block;margin-top:4px;padding:0 6px;border:1px solid var(--grid);border-radius:4px;font-size:11px;color:var(--muted)}
.focus{color:var(--muted);font-size:12px}
.notes p{margin:0 0 6px}.notes p:last-child{margin:0}
.notes .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.deltas{white-space:nowrap}
a{color:var(--keep)}
.refresh{position:fixed;top:12px;right:16px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;background:var(--surface);padding:2px 6px;border-radius:6px}
</style>

// The setting lives in the query string so it survives the reload, including from a file:// URL.
{
  const box = document.getElementById('refresh');
  box.checked = new URLSearchParams(location.search).get('refresh') !== 'off';
  if (box.checked) setTimeout(() => location.reload(), 60000);
  box.onchange = () => { location.search = box.checked ? '' : '?refresh=off'; };
}

n 1 added DEFERRED. The likely cause is how the rule matches text: it seems to flag getDescribe on a receiver named sObjectType (like the Account.SObjectType pattern), while the identically written token.getDescribe() at line 48 is not flagged. It also seems to accept the deferred option only as the bare SObjectDescribeOptions.DEFERRED, so the Schema.-qualified form may not count. Renaming the parameter and dropping the Schema. prefix clears both possible matches. Apex callers pass arguments by position, so renaming the parameter changes no behaviour, coverage or tests.","decision":["every focus dimension rose by more than its margin and no other dimension fell by more than its margin"],"learning":"PMD's EagerlyLoadedDescribeSObjectResult check is textual: it ignored the Schema.-qualified DEFERRED and flagged a receiver named sObjectType. Renaming the parameter and using the bare SObjectDescribeOptions.DEFERRED cleared it with no effect on tests or coverage, so when a rule still fires after a semantically correct fix, try receiver names and qualifier forms before restructuring code.","deltas":{"PMD":13.8,"Graph Engine":0,"Tests passing":0,"Code coverage":0,"Test run time":-0.1,"Limit headroom":-6.4,"Resource efficiency":0},"patch":"patches/2.patch","run":"runs/2","cost":{"plan":0.292078,"implement":0.1224951,"learn":0.0604187}},{"iteration":3,"at":"2026-11-14T09:37:39.065Z","outcome":"discard","dryRun":false,"overall":88.2,"current":87,"hours":0.123,"minutes":1.9,"focus":["Limit headroom"],"reason":"Limit headroom is the weakest dimension (63.8; the headroom test uses 36.2% of its CPU limit). The main cost is the static getNameField: the headroom test calls it twice per object per round (about 750 calls), and each call loads the field map and runs getDescribe().isNameField() on every field. Caching the resolved name field per SObjectType in a static map, cleared by flushCache() like the other caches, cuts this to about one scan per type per flush window (about 40 instead of 750). Results are unchanged, including the null cases. fflib_SObjectSelector also calls getNameField, so its callers in the QueryFactory and SecurityUtils tests gain too. Every new line runs in existing tests, so this is not padding, and no suppressions are added.","decision":["PMD fell 7.4, more than its margin 0.5"],"learning":"A static cache in getNameField raised Limit headroom as expected, but its extra branches (containsKey check, break, new property) pushed fflib_SObjectDescribe's total cyclomatic complexity past PMD's threshold, costing more than the gain. Fix CPU cost in this class with near-zero added control flow, for example by storing the name field in the existing instanceCache or an existing instance, or by trimming branches elsewhere to make room.","deltas":{"PMD":-7.4,"Graph Engine":0,"Tests passing":0,"Code coverage":0.8,"Test run time":2,"Limit headroom":11.8,"Resource efficiency":0.9},"patch":"patches/3.patch","run":"runs/3","cost":{"plan":0.37501920000000005,"implement":0.1509825,"learn":0.0618307}},{"iteration":4,"at":"2026-11-14T09:39:35.861Z","outcome":"keep","dryRun":false,"overall":88.7,"current":88.7,"hours":0.16,"minutes":2.2,"focus":["Limit headroom"],"reason":"Limit headroom (63.8, CPU 36.2% in headroomBulkDescribes) is the weakest dimension. The main cost is getNameField: about 750 calls, and each one scans every field's getDescribe().isNameField(). Caching the result in a lazy property on the fflib_SObjectDescribe instance reuses the existing per-type instanceCache, which flushCache() already clears, so no new static map is needed. That cuts the scans to about one per type per flush window. Iteration 3 failed because added branches pushed class complexity past PMD's threshold. To offset that, this plan removes more control flow than it adds: two ifs, a ?? and ?. operators from the getDescribe(String) and getDescribe(DescribeSObjectResult) overloads, which can delegate to getDescribe(Schema.SObjectType). Results are unchanged, er construction still work because the prefix is computed inside each call.","decision":["re-measured a close discard and averaged the noisy dimensions over 2 runs (first run {\"PMD\":100,\"Graph Engine\":100,\"Tests passing\":100,\"Code coverage\":96.5,\"Test run time\":70.9,\"Limit headroom\":73,\"Resource efficiency\":78.7})","Limit headroom is a focus but rose 0.2, not more than its margin 8.3"],"learning":"Micro-optimizations on cold or low-frequency paths (deferred describe on rebuild, hoisting a string concat, collapsing a containsKey/get pair) moved Limit headroom by only ~0.2, below its margin, so headroom gains have to come from eliminating repeated work on the hottest call sites (e.g. per-call field scans, thousands of getField lookups) rather than shaving constant factors elsewhere.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":0,"Test run time":0.3,"Limit headroom":0.2,"Resource efficiency":-0.1},"patch":"patches/5.patch","run":"runs/5","cost":{"plan":0.46832359999999995,"implement":0.1333803,"learn":0.06271270000000001}},{"iteration":6,"at":"2026-11-14T09:44:39.841Z","outcome":"discard","dryRun":false,"overall":89.7,"current":88.7,"hours":0.26,"minutes":3.1,"focus":["Limit headroom"],"reason":"Limit headroom (72.7; headroomBulkDescribes at 27.3% CPU) is the weakest movable dimension. The remaining hot spot in this class is NamespacedAttributeMap.keySet(true), which about 38 rounds call on the global describe (over a thousand keys). Each call builds a new Set by running removeStartIgnoreCase(currentNamespace + '__') on every key. When currentNamespace is blank (unpackaged orgs, including the test org) the prefix is '__', which no key starts with, so the loop does nothing. Returning values.keySet() directly gives the same contents without the per-key work. Iteration 5 only hoisted the concat and gained 0.2; this removes the loop itself on the no-namespace path. Both branches still run: fflib_SObjectDescribeTest line 105 sets a fake namespace and calls keySet(true), and the headroom test runs the blank-namespace path. The new && adds one unit of complexity, so three null-guard ifs become null-safe ?. calls with the same behaviour (null input still returns null, because getDescribe(null SObjectType) returns null). That keeps class complexity under PMD's threshold, the cause of the iteration 3 discard. No suppressions and no padding.","decision":["re-measured a close discard and averaged the noisy dimensions over 2 runs (first run {\"PMD\":100,\"Graph Engine\":100,\"Tests passing\":100,\"Code coverage\":97,\"Test run time\":72.7,\"Limit headroom\":72.9,\"Resource efficiency\":81.1})","Limit headroom is a focus but rose 4.0, not more than its margin 8.3"],"learning":"Trimming the per-call cost of keySet(true) on the blank-namespace path moved Limit headroom only about half the required margin, so it is a real but minor hot spot. Replacing null-guard ifs with ?. keeps PMD complexity down at no cost to other dimensions, but bigger headroom gains need the dominant costs (name-field scans, global describe rebuilds) cut or cached.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":0.5,"Test run time":1.4,"Limit headroom":4,"Resource efficiency":0.9},"patch":"patches/6.patch","run":"runs/6","cost":{"plan":0.5541043999999999,"implement":0.15038870000000001,"learn":0.0630527}},{"iteration":7,"at":"2026-11-14T09:47:48.468Z","outcome":"discard","dryRun":false,"overall":89.6,"current":88.7,"hours":0.322,"minutes":3.7,"focus":["Limit headroom"],"reason":"Limit headroom (72.7; headroomBulkDescribes uses 27.3% of its CPU limit) is the weakest dimension that can still move. Iteration 6 only made keySet(true) cheaper (+4.0, under the 8.3 margin), so this candidate cuts three hot paths together. (1) On the blank-namespace path, keySet(true) skips the per-key removeStartIgnoreCase loop. That loop does nothing, because no API name starts with '__'. It runs about 38 times over more than 1,000 global-describe keys. (2) getObject, which about 2,600 getField calls go through, does one toLowerCase, a null-coalescing get on the namespaced key and then a plain get. Today it builds the string '__name', misses on containsKey, and then calls toLowerCase and get again. Describe-backed maps never hold nulls, so ?? gives the same result as containsKey/get. When implyNamespace is false it returns values.get(key), which matches the old 'contains ? get : null'. (3) The name-field scan checks fields.get('name') first, so for Account, Contact, Opportunity and Lead it stops after one field describe instead of describing every field. That removes most of the ~2,200 per-field describes across the 40 rebuilds after a flush. Case falls back to the full scan. The scan returns the same field because only one field per object has isNameField() = true. To keep PMD complexity at or below today's level, getObject drops its if/else-if/else chain. Three null-guard ifs become ?. delegation, with nulls behaving the same, because getDescribe((Schema.SObjectType) null) returns null. That offsets the new && and ?. operators. Every changed line runs in existing tests: fflib_SObjectDescribeTest line 105 runs the namespaced keySet path, the headroom test runs the blank path, and Case runs the full-scan fallback. No suppressions, no padding.","decision":["re-measured a close discard and averaged the noisy dimensions over 2 runs (first run {\"PMD\":100,\"Graph Engine\":100,\"Tests passing\":100,\"Code coverage\":97,\"Test run time\":71.3,\"Limit headroom\":74.5,\"Resource efficiency\":80})","Limit headroom is a focus but rose 4.4, not more than its margin 8.3"],"learning":"Bundling three Apex-level CPU trims (keySet short-circuit, getObject simplification, name-field-first scan) lifted Limit headroom only slightly, under the noise margin, while other dimensions stayed flat. Most of the CPU is probably in native describe calls and flush/rebuild frequency, so a bigger gain needs fewer describe call   ].map(([k, v]) => `<span><b>${k}:</b> ${v}</span>`).join('');
  document.getElementById('retro-summary').textContent = r.summary;
  const tone = {high: '--rejected', medium: '--gated', low: '--discard', good: '--keep', questionable: '--gated', bad: '--rejected'};
  const pill = v => `<span class="pill" style="background:${css(tone[v])}">${esc(v)}</span>`;
  const groups = [
    ['Behaviour changes', r.behaviourChanges, i => `${pill(i.severity)}<div class="focus" style="margin-top:6px">${i.caughtByTests ? 'caught by tests' : 'not caught by tests'}</div>`,
      i => note('Evidence', i.evidence) + note('Iterations', i.iterations.join(', ')) + note('Proposed test', i.proposedTest)],
    ['Patterns', r.patterns, i => pill(i.verdict), i => note('Evidence', i.evidence)],
    ['Test gaps', r.testGaps, () => '', i => note('Proposed test', i.proposedTest)],
    ['Other', r.other, () => '', () => '']];
  document.getElementById('retro-items').innerHTML = `
    <tr><th>Code</th><th>Kind</th><th>Finding</th></tr>
    ${groups.flatMap(([kind, items, badge, extra]) => items.map(i => `<tr>
      <td><b>${esc(i.code)}</b></td><td>${kind}${badge(i) ? `<div style="margin-top:4px">${badge(i)}</div>` : ''}</td>
      <td class="notes"><p><b>${esc(i.title)}</b></p><p>${esc(i.detail)}</p>${extra(i)}</td></tr>`)).join('')}`;
}
</script>
</body>
</html>

:root{--surface:#fcfcfb;--text:#0b0b0b;--muted:#52514e;--grid:#e6e5e0;--keep:#2a78d6;--discard:#8f8e89;--gated:#c26a1b;--rejected:#b8433a;--nochange:#b5b4ae;--error:#8e2a8e;--up:#1f7a3d;--down:#b8433a}

body{margin:0;padding:24px 16px;background:var(--surface);color:var(--text);font:14px/1.4 system-ui,sans-serif}
main{max-width:1280px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 16px}
.meta b{color:var(--text);font-weight:600}
code{font:12px ui-monospace,monospace}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:24px}
.card{border:1px solid var(--grid);border-radius:10px;padding:14px 16px;display:flex;gap:16px;align-items:center}
.card svg.graphic{flex:none}
.card > div{min-width:0}
.card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.card .big{font-size:28px;font-weight:600;line-height:1.1}
.card .sub{color:var(--muted);font-size:13px;margin-top:4px}
.card .row{margin-top:4px;font-size:13px}
.card .row svg{vertical-align:-3px;margin-right:6px;color:var(--muted)}
.card .row svg[width="10"]{vertical-align:-1px}
h2{font-size:14px;color:var(--muted);font-weight:600;margin:28px 0 8px}
.chart{width:100%}
.empty{color:var(--muted);padding:32px 16px;text-align:center;border:1px dashed var(--grid);border-radius:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--muted);font-weight:600;text-align:left;font-size:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
.tag{display:inline-block;margin-top:4px;padding:0 6px;border:1px solid var(--grid);border-radius:4px;font-size:11px;color:var(--muted)}
.focus{color:var(--muted);font-size:12px}
.notes p{margin:0 0 6px}.notes p:last-child{margin:0}
.notes .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.deltas{white-space:nowrap}
a{color:var(--keep)}
.refresh{position:fixed;top:12px;right:16px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;background:var(--surface);padding:2px 6px;border-radius:6px}
</style>

<script>
// The setting lives in the query string so it survives the reload, including from a file:// URL.
{
  const box = document.getElementById('refresh');
  box.checked = new URLSearchParams(location.search).get('refresh') !== 'off';
  if (box.checked) setTimeout(() => location.reload(), 60000);
  box.onchange = () => { location.search = box.checked ? '' : '?refresh=off'; };
}
</script>

he helper return a null token, so Graph Engine flags every downstream `fieldToken.getDescribe()` call (6 findings, -32.4). Any change that lets a shared helper return null will be flagged at all its callers, so the last uncovered throw should be treated as unremovable unless a test can reach it (a test that passes a null objType with bypass off).","deltas":{"PMD":0,"Graph Engine":-32.4,"Tests passing":0,"Code coverage":0.5,"Test run time":-0.7,"Limit headroom":0,"Resource efficiency":0},"patch":"patches/22.patch","run":"runs/22","cost":{"plan":0.3728104,"implement":0.1179296,"learn":0.0679907}},{"iteration":23,"at":"2026-11-12T06:56:04.179Z","outcome":"discard","dryRun":false,"overall":97.7,"current":97.5,"hours":0.881,"minutes":2.4,"focus":["Test run time"],"reason":"Test run time (84.1, 7.578s) is the only dimension still below 100 that can move: coverage is capped by the Graph Engine-required NPE throw (#20, #22), and the Resource efficiency penalty comes from fflib_SObjectSelectorTest SOQL. Every checkObjectIs* call does a full objType.getDescribe(), about 1,800 in headroomBulkFieldChecks plus more in the CRUD/FLS tests. Caching one DescribeSObjectResult per SObjectType, built with SObjectDescribeOptions.DEFERRED and cleared on user change like the existing caches, cuts that to about 5 lightweight describes. Behaviour is the same: bypass still returns before any describe, a null objType still throws NullPointerException (map miss, then null.getDescribe()), and System.runAs stays correct because the cache is cleared when the user changes. Every new line runs in existing tests, there are no new parameters, and the helper never returns null, so coverage, PMD and Graph Engine should stay flat.","decision":["Test run time is a focus but rose 1.2, not more than its margin 3"],"learning":"Caching DescribeSObjectResult per type in the checkObjectIs* path did not cut test run time. The extra static helper call and per-call user-id check cost about as much as the getDescribe() calls they removed, so the remaining time likely comes from outside fflib_SecurityUtils (such as selector-test SOQL), and further micro-optimisation of the object-check path is unlikely to pay.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":0,"Test run time":1.2,"Limit headroom":0,"Resource efficiency":0},"patch":"patches/23.patch","run":"runs/23","cost":{"plan":0.46726819999999997,"implement":0.1581765,"learn":0.0710747}},{"iteration":24,"at":"2026-11-12T06:58:28.999Z","outcome":"discard","dryRun":false,"overall":97.1,"current":97.5,"hours":0.922,"minutes":2.4,"focus":["Test run time"],"reason":"Test run time (84.1, 7.578s) is the only dimension that can still move: coverage is capped by the throw Graph Engine needs (#20, #22), and headroom, PMD and Graph Engine are at 100. QueryFactory, used by the selector and query-factory tests, calls fflib_SecurityUtils.checkFieldIsReadable(SObjectType, SObjectField) once per selected field, and each call runs a platform fieldToken.getDescribe(). A per-user Map\u003cSObjectField, DescribeFieldResult> cache in that overload drops the repeat getDescribe() calls for the same token. The cache is cleared in resetCachesIfUserChanged, so System.runAs results stay correct. Behaviour is the same: a null token misses the map (Map.get(null) returns null) and still throws NullPointerException on null.getDescribe(); bypass handling is still in the DescribeFieldResult overload; the same FlsException is thrown. Every new line runs in existing tests (miss branch on the first call, hit branch after), so coverage cannot fall. The new helper takes 1 parameter and never returns null, so PMD and Graph Engine should stay flat.","decision":["Test run time is a focus but rose -2.9, not more than its margin 3"],"learning":"Caching getDescribe() per SObjectField token in checkFieldIsReadable made test run time worse, because each call now pays a UserInfo.getUserId() platform call plus a map lookup and few tokens repeat in QueryFactory tests; per-call cache overhead outweighs the saved describe, so future run-time candidates should cut calls (hoist user checks, skip redundant work) rather than add per-field caches.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":0,"Test run time":-2.9,"Limit headroom":0,"Resource efficiency":0},"patch":"patches/24.patch","run":"runs/24","cost":{"plan":0.485767,"implement":0.1475933,"learn":0.0693367}}],"retro":{"ascent":"security-utils-2","at":"2026-11-12T08:09:06.205Z","base":"f296360208903e68948be73f68fbb1237d6c9e58","head":"0cbeb5c703a54dc2b1ca96cf28b20b6b034fb4fe","changedTests":[],"step":{"model":"claude-opus-5-5","durationMs":87006,"costUsd":0.7356368},"summary":"Only fflib_SecurityUtils.cls changed. PMD (23.8→100) came from adding braces (#1), Graph Engine (67.6→100) from an explicit null-check throw in fieldTokenFor (#10), and Limit headroom (51.6→100) mostly from caches, especially the verified-list Set\u003cList\u003cString>> cache (#16), which skips work only because headroomBulkFieldChecks sends identical lists 120 times. Allow/deny results for the tested cases are unchanged, but the evolved code now caches permission outcomes for the whole transaction and resolves error labels once at class load, which no test covers. Resource efficiency (fflib_SObjectSelectorTest, 98.8) did not move.","behaviourChanges":[{"code":"B1","title":"Passed field lists skip FLS re-checks for the rest of the transaction","detail":"Once checkRead/checkInsert/checkUpdate(SObjectType, List\u003cString>) passes for a list, an equal list for the same user, operation and type returns right after the CRUD check, without any per-field FLS evaluation. Revoking permissions mid-transaction (for example deleting a PermissionSetAssignment or PermissionSet field permission inside the same runAs) would be seen by the baseline, which describes again on every call, but not by the evolved code. Only a change of UserInfo.getUserId() invalidates the cache.","evidence":"fflib_SecurityUtils.cls verifiedListsFor/resetCachesIfUserChanged (~lines 174-200), checkInsert/checkRead/checkUpdate early return (~241-243, 281-283, 321-323)","iterations":[16],"severity":"medium","caughtByTests":false,"proposedTest":"In System.runAs(user holding a permission set with FLS on a field): call checkRead(type, [field]) and expect a pass; delete the field permission; call checkRead again and assert FlsException. (First confirm the platform itself re-evaluates within one transaction; if it doesn't, document the cache as matching platform behaviour.)"},{"code":"B2","title":"DescribeFieldResult cached per type and field name for the transaction","detail":"The list methods reuse a DescribeFieldResult cached under the type and field name, cleared only when the user changes. Within one user, any permission refresh the platform would show is masked. The single-field and SObjectField overloads still describe fresh each time, so list and single-field calls can disagree after a permission change.","evidence":"fflib_SecurityUtils.cls fieldDescribesFor/fieldDescribeFor (~lines 202-228)","iterations":[15],"severity":"low","caughtByTests":false,"proposedTest":"Same as the revoked-permission test, comparing checkRead(type, List\u003cString>) with checkFieldIsReadable(type, String) after the change."},{"code":"B3","title":"Exception labels resolved at class load, not at throw time","detail":"CRUD_MESSAGES and FLS_MESSAGES are static finals initialised when the class first loads, under the user running at that moment. A later System.runAs user with a different language gets messages in the first user's language. The baseline read System.Label inside the exception constructor, so it used the throwing user's language.","evidence":"fflib_SecurityUtils.cls:43-54; CrudException/FlsException constructors ~81-86, ~106-113","iterations":[10],"severity":"low","caughtByTests":false,"proposedTest":"Load the class as the admin (call checkObjectIsReadable on Account), then System.runAs a user with LanguageLocaleKey set to another language and a translated label; trigger a CrudException and assert the message equals that user's System.Label value."},{"code":"B4","title":"Unbounded heap growth from cloned verified lists","detail":"Every distinct passing list is cloned into a per-type, per-operation Set and kept for the transaction. Callers that build many different dynamic lists (selectors with varying field sets, large batch jobs) keep growing heap with no eviction. Each call also hashes the whole list for contains(), which is O(n) even on a hit.","evidence":"fflib_SecurityUtils.cls verified.add(fieldNames.clone()) ~252, ~292, ~332","iterations":[16],"severity":"low","caughtByTests":false,"proposedTest":"Call checkRead with 5,000 distinct one-field lists and assert Limits.getHeapSize() stays under a chosen budget, or check the growth is acceptable."},{"code":"B5","title":"Unchanged: null, unknown-field and bypass behaviour","detail":"A null objType still throws NullPointerException (CRUD describe when bypass is off, the fieldTokenFor guard when it is on). An unknown field name still ends in null.getDescribe(), even with bypass on, as in the baseline. Lists are recorded only when bypass is off, and failures are never cached. Recorded here as checked, not as a change.","evidence":"fflib_SecurityUtils.cls fieldTokenFor ~155-170; fieldDescribeFor ~221-228","iterations":[10,15,16],"severity":"low","caughtByTests":false,"proposedTest":"Assert NullPointerException for checkRead(null, ['Name']) with bypass on and off, and for checkRead(Account.SObjectType, ['NoSuchField__c']) with bypass on."}],"patterns":[{"code":"P1","title":"Verified-list result cache","detail":"A big CPU win on the headroom test, which repeats identical lists 120 times, but it is shaped to the benchmark. Real callers seldom repeat identical lists, and it turns a stateless permission check into a stateful one. Storing a clone and clearing on user change are sound precautions   vconcat: [
    {width: 'container', height: 320, layer: [
      {data: {values: steps}, mark: {type: 'line', interpolate: 'step-after', strokeWidth: 2, color: css('--keep')},
       encoding: {x: {...hoursAxis, axis: {...hoursAxis.axis, title: null, labels: false}}, y: {field: 'current', type: 'quantitative', title: 'Overall score', scale: {zero: false}}}},
      {data: {values: s.fit}, mark: {type: 'line', strokeDash: [6, 4], strokeWidth: 2, color: css('--muted'), opacity: 0.3},
       encoding: {x: {field: 'hours', type: 'quantitative'}, y: {field: 'fit', type: 'quantitative'}}},
      ...ends.map(([step, align]) => (
       {data: {values: [step]}, mark: {type: 'text', align, baseline: 'bottom', dy: -6, fontSize: 28, fontWeight: 600, color: css('--text')},
        encoding: {x: {field: 'hours', type: 'quantitative'}, y: {field: 'current', type: 'quantitative'}, text: {field: 'current', format: '.1f'}}})),
      {data: {values: withFocus(scored)}, mark: {type: 'point', size: 90, strokeWidth: 2, opacity: 1},
       encoding: {x: {field: 'hours', type: 'quantitative'}, y: {field: 'overall', type: 'quantitative'},
                  color: outcome, shape: {field: 'outcome', legend: null},
                  fill: {condition: {test: "datum.outcome === 'keep'", value: css('--keep')}, value: css('--surface')},
                  tooltip: tip}}]},
    {width: 'container', height: 60, data: {values: withFocus(unscored)}, mark: {type: 'tick', thickness: 2, size: 14},
     encoding: {x: hoursAxis, y: {field: 'outcome', type: 'nominal', title: null, scale: {domain: ['gated', 'rejected', 'no-change', 'error']}},
                color: {...outcome, legend: null}, tooltip: tip}}
  ], resolve: {scale: {x: 'shared'}}}, {actions: false});
const timed = climb.filter(r => r.minutes != null);
if (!timed.length) waiting('durations');
else vegaEmbed('#durations', {$schema: 'https://vega.github.io/schema/vega-lite/5.json', width: 'container', height: 200, config,
  data: {values: withFocus(timed)},
  mark: {type: 'bar', cornerRadiusTopLeft: 4, cornerRadiusTopRight: 4, width: {expr: "min(40, bandwidth('x') * 0.8)"}},
  encoding: {x: {field: 'iteration', type: 'ordinal', title: 'Iteration', axis: {labelAngle: 0}},
             y: {field: 'minutes', type: 'quantitative', title: 'Minutes'},
             color: outcome, tooltip: tip}}, {actions: false});

const usd = x => `$${x.toFixed(2)}`;
document.getElementById("cost-title").textContent =
  `Cumulative agent cost by step: ${usd(data.cost.total)} total (${Object.entries(data.cost.byStep).map(([k, v]) => `${k} ${usd(v)}`).join(", ")}), estimated at list price`;
const byCost = Object.entries(data.cost.byStep).sort(([, a], [, b]) => b - a).map(([step]) => step);
if (!data.rows.length) waiting("cost");
else vegaEmbed("#cost", {$schema: "https://vega.github.io/schema/vega-lite/5.json", width: "container", height: 240, config,
  data: {values: data.cost.series.map(p => ({...p, rank: byCost.indexOf(p.step)}))},
  mark: {type: "area", line: {strokeWidth: 2}, opacity: 0.25},
  encoding: {x: hoursAxis,
             y: {field: "usd", type: "quantitative", stack: "zero", title: "Cumulative cost (USD)", axis: {format: "$.2f"}},
             color: {field: "step", title: "Step", scale: {domain: [...byCost].reverse(), range: [...byCost].reverse().map(step => css(STEP_COLOURS[step]))}},
             order: {field: "rank"},
             tooltip: [{field: "step", title: "Step"}, {field: "hours", title: "Hours", format: ".2f"}, {field: "usd", title: "Cumulative", format: "$.2f"}]}}, {actions: false});

const spark = series => {
  const w = 96, h = 24, lo = Math.min(...series), hi = Math.max(...series), span = hi - lo || 1;
  const pts = series.map((v, i) => [series.length > 1 ? i / (series.length - 1) * w : w / 2, h - 2 - (v - lo) / span * (h - 4)]);
  const [lx, ly] = pts.at(-1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--keep)" stroke-width="1.5"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="var(--keep)"/></svg>`;
};
document.getElementById('dimensions').innerHTML = `
  <tr><th>Dimension</th><th class="num">Baseline</th><th class="num">Current</th><th class="num">Change</th><th class="num">Margin</th><th>Kept iterations</th></tr>
  ${data.dimensions.map(d => `<tr><td>${esc(d.name)}</td><td class="num">${f(d.baseline, 1)}</td><td class="num">${f(d.current, 1)}</td>
    <td class="num ${trend(d.delta)}">${signed(d.delta)}</td><td class="num">${d.margin}</td><td>${spark(d.series)}</td></tr>`).join('')}`;

const deltas = r => r.deltas ? Object.entries(r.deltas).filter(([, v]) => v !== 0)
  .map(([k, v]) => `<div class="deltas">${esc(k)} <span class="${trend(v)}">${signed(v)}</span></div>`).join('') || '<span class="focus">no change</span>' : '';
const note = (k, v) => v ? `<p><span class="k">${k}</span>${esc(v)}</p>` : '';
const link = (label, href) => href ? `<div><a href="${esc(href)}">${label}</a></div>` : '';
document.getElementById('iterations').innerHTML = `
  <tr><th class="num">#</th><th>Outcome</th><th class="num">Overall</th><th>Changes vs kept</th><th>Plan, decision and learning</th><th>Files</th></tr>
  ${[...data.rows].reverse().map(r => `<tr>
    <td class="num">${r.iteration}</td>
    <td><span class="pill" style="background:${colour(r.outcome)}">${esc(r.outcome)}</span>${r.dryRun ? '<div><span class="tag">dry run</span></div>' : ''}
      ${r.focus.length ? `<div class="focus" style="margin-top:6px">${esc(r.focus.join(', '))}</div>` : ''}</td>
    <td class="num">${f(r.overall)}</td>
    <td>${deltas(r)}</td>
    <td class="notes">${note('Reason', r.reason)}${note('Decision', r.decision.join('; '))}${note('Learning', r.learning)}</td>
    <td>${link('patch', r.patch)}${link('run', r.run)}</td></tr>`).join('') || '<tr><td colspan="6" class="focus">No iterations yet.</td></tr>'}`;

if (data.retro) {
  const r = data.retro;
  document.getElementById('retro').hidden = false;
  document.getElementById('retro-meta').innerHTML = [
    ['Commits', `<code>${esc(r.base.slice(0, 8))}..${esc(r.head.slice(0, 8))}</code>`], ['Written', esc(when(r.at))],
    ['Tests changed', esc(r.changedTests.join(', ') || 'none')]
  ].map(([k, v]) => `<span><b>${k}:</b> ${v}</span>`).join('');
  document.getElementById('retro-summary').textContent = r.summary;
  const tone = {high: '--rejected', medium: '--gated', low: '--discard', good: '--keep', questionable: '--gated', bad: '--rejected'};
  const pill = v => `<span class="pill" style="background:${css(tone[v])}">${esc(v)}</span>`;
  const groups = [
    ['Behaviour changes', r.behaviourChanges, i => `${pill(i.severity)}<div class="focus" style="margin-top:6px">${i.caughtByTests ? 'caught by tests' : 'not caught by tests'}</div>`,
      i => note('Evidence', i.evidence) + note('Iterations', i.iterations.join(', ')) + note('Proposed test', i.proposedTest)],
    ['Patterns', r.patterns, i => pill(i.verdict), i => note('Evidence', i.evidence)],
    ['Test gaps', r.testGaps, () => '', i => note('Proposed test', i.proposedTest)],
    ['Other', r.other, () => '', () => '']];
  document.getElementById('retro-items').innerHTML = `
    <tr><th>Code</th><th>Kind</th><th>Finding</th></tr>
    ${groups.flatMap(([kind, items, badge, extra]) => items.map(i => `<tr>
      <td><b>${esc(i.code)}</b></td><td>${kind}${badge(i) ? `<div style="margin-top:4px">${badge(i)}</div>` : ''}</td>
      <td class="notes"><p><b>${esc(i.title)}</b></p><p>${esc(i.detail)}</p>${extra(i)}</td></tr>`)).join('')}`;
}
</script>
</body>
</html>

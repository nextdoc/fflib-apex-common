<style>
:root{--surface:#fcfcfb;--text:#0b0b0b;--muted:#52514e;--grid:#e6e5e0;--keep:#2a78d6;--discard:#8f8e89;--gated:#c26a1b;--rejected:#b8433a;--nochange:#b5b4ae;--error:#8e2a8e;--up:#1f7a3d;--down:#b8433a}
@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--text:#fff;--muted:#c3c2b7;--grid:#383835;--keep:#3987e5;--discard:#8f8e89;--gated:#e08a3c;--rejected:#e0675d;--nochange:#5e5d59;--error:#c565c5;--up:#4cc176;--down:#e0675d}}
body{margin:0;padding:24px 16px;background:var(--surface);color:var(--text);font:14px/1.4 system-ui,sans-serif}
main{max-width:1280px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 16px}
.meta b{color:var(--text);font-weight:600}
code{font:12px ui-monospace,monospace}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:24px}
.card{border:1px solid var(--grid);border-radius:10px;padding:14px 16px;display:flex;gap:16px;align-items:center}
.card svg.graphic{flex:none}
.card > div{min-width:0}
.card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.card .big{font-size:28px;font-weight:600;line-height:1.1}
.card .sub{color:var(--muted);font-size:13px;margin-top:4px}
.card .row{margin-top:4px;font-size:13px}
.card .row svg{vertical-align:-3px;margin-right:6px;color:var(--muted)}
.card .row svg[width="10"]{vertical-align:-1px}
h2{font-size:14px;color:var(--muted);font-weight:600;margin:28px 0 8px}
.chart{width:100%}
.empty{color:var(--muted);padding:32px 16px;text-align:center;border:1px dashed var(--grid);border-radius:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--muted);font-weight:600;text-align:left;font-size:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
.tag{display:inline-block;margin-top:4px;padding:0 6px;border:1px solid var(--grid);border-radius:4px;font-size:11px;color:var(--muted)}
.focus{color:var(--muted);font-size:12px}
.notes p{margin:0 0 6px}.notes p:last-child{margin:0}
.notes .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.deltas{white-space:nowrap}
a{color:var(--keep)}
.refresh{position:fixed;top:12px;right:16px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;background:var(--surface);padding:2px 6px;border-radius:6px}
</style>
</head>

<script>
// The setting lives in the query string so it survives the reload, including from a file:// URL.
{
  const box = document.getElementById('refresh');
  box.checked = new URLSearchParams(location.search).get('refresh') !== 'off';
  if (box.checked) setTimeout(() => location.reload(), 60000);
  box.onchange = () => { location.search = box.checked ? '' : '?refresh=off'; };
}
</script>

],"reason":"Code coverage (90.8, 218/240) is held down by about 6 lines that never run: the CURRENCY_ISO_CODE_ENABLED property getter (if/assign/return, lines 46-56) and the sObjectFieldsMap property getter (lines 102-110), its only consumer. isCurrencyIsoCodeAvailable() checks UserInfo.isMultiCurrencyOrganization() first, so in a non-multi-currency org neither getter ever runs. Replacing the two properties with an expression inside the existing one-line return, using the statically cached describeSObject(getSObjectType()), gives the same result (fields.getMap().containsKey('currencyisocode')) with the same && short-circuit, and removes those lines. Expected coverage is about 218/234 = 93.2. The signature of isCurrencyIsoCodeAvailable (@TestVisible private Boolean, called by tests) is unchanged. The removed code never ran in the headroom loop, so CPU is flat (headroom/run-time moves should be noise). The edits only delete code, so PMD and Graph Engine are unaffected.","decision":["Code coverage is a focus but rose -0.2, not more than its margin 0"],"learning":"Deleting never-run property getters and inlining their logic into a multi-line expression did not raise coverage, because the new expression added executable lines while the removal only shaved a few uncovered ones. It also cost headroom, probably from an uncached getMap() call on a hot path. Coverage candidates should execute uncovered lines from existing tests or delete dead code without adding executable lines, and should keep describe work off the hot loop.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":-0.2,"Test run time":-2.1,"Limit headroom":-4.7,"Resource efficiency":0},"patch":"patches/24.patch","run":"runs/24","cost":{"plan":0.8111105999999999,"implement":0.1407156,"learn":0.0668987}}],"retro":{"ascent":"sobject-selector-1","at":"2026-11-12T22:56:29.845Z","base":"971d9bca9b7aa9900f92dda6b91f414cacd374e7","head":"b8fc1f112ec984e5ab6ab7d92a170c467f6a35d4","changedTests":[],"step":{"model":"claude-opus-5-5","durationMs":73517,"costUsd":0.6829168},"summary":"Only fflib_SObjectSelector.cls changed. PMD went from 49 to 100 through brace wraps and the DEFERRED describe option (iterations 3, 5, 9, 10). Coverage went from 83.6 to 90.8 by wiring uncalled public methods into paths that already run (iterations 13, 15), not by adding tests. Limit headroom ended 1 point below the baseline even though iterations 9 and 19 added static describe, field-name and default-order-by caches. Normal behaviour is preserved. The main change is that the DescribeSObjectResult (and so isAccessible()) is now cached per transaction instead of per selector, which can give stale CRUD answers across System.runAs.","behaviourChanges":[{"code":"B1","title":"Object describe and isAccessible() now cached per transaction, not per selector","detail":"The sObjectDescribe getter now reads a static SOBJECT_DESCRIBE_CACHE keyed by SObjectType. In the baseline, each new selector instance ran a fresh getDescribe(), so a selector built inside System.runAs saw the runAs user's object access. Now the first describe of a type in the transaction is reused by every later selector, whichever user is running. Public assertIsAccessible() can then pass or fail based on another user's permissions. The CrudException catch is safe because its fallback throw sends the same message either way. In production the running user doesn't change within a transaction, so the risk is mostly tests and code that use System.runAs.","evidence":"fflib_SObjectSelector.cls:89-95, 420, 704-715","iterations":[9,10],"severity":"medium","caughtByTests":false,"proposedTest":"In one test method, outside runAs, call new AccountSelector().assertIsAccessible() (passes as admin). Then, inside runAs with a user who has no Account read access, call new AccountSelector().assertIsAccessible() and assert it throws DomainException. With the static cache it doesn't throw."},{"code":"B2","title":"Describe fetched with SObjectDescribeOptions.DEFERRED","detail":"Child relationships load lazily. The selector never reads them from this describe, so there is no visible change. If someone later adds getChildRelationships() through sObjectDescribe, it still works, just loaded lazily.","evidence":"fflib_SObjectSelector.cls:711","iterations":[10],"severity":"low","caughtByTests":false,"proposedTest":"Not needed. Optionally assert getSObjectName() and the CurrencyIsoCode detection give the same results as an EAGER describe."},{"code":"B3","title":"Default getOrderBy() string cached per SObjectType for the transaction","detail":"The name field, its encryption flag and whether CreatedDate exists are schema facts, so the result matches the baseline. Overridden getOrderBy() and the per-instance m_orderBy behave as before. The fallback branch now reads the shared cached describe instead of the instance's sObjectFieldsMap, which gives the same answer.","evidence":"fflib_SObjectSelector.cls:223-228, 717-742","iterations":[19],"severity":"low","caughtByTests":true,"proposedTest":"Assert the default getOrderBy() for an object with no name field or an encrypted one (for example a custom object with an AutoNumber or encrypted Name) returns CreatedDate or Id. Today only name-field objects are exercised."},{"code":"B4","title":"Constructor routes through setDataAccess","detail":"Same end state: non-LEGACY modes only come from the (Boolean, DataAccess) constructor, which already passes enforceCRUD and enforceFLS as false, and null access also leaves both false. setDataAccess is non-virtual, so subclasses can't intercept it during construction.","evidence":"fflib_SObjectSelector.cls:148-154, 196-208, 266-276","iterations":[13],"severity":"low","caughtByTests":true,"proposedTest":"Assert isEnforcingCRUD() and isEnforcingFLS() are false for USER_MODE and SYSTEM_MODE selectors, and true or false as passed for LEGACY selectors."},{"code":"B5","title":"Extra assertIsAccessible() call in the CRUD catch","detail":"It throws              color: {field: "step", title: "Step", scale: {domain: [...byCost].reverse(), range: [...byCost].reverse().map(step => css(STEP_COLOURS[step]))}},
             order: {field: "rank"},
             tooltip: [{field: "step", title: "Step"}, {field: "hours", title: "Hours", format: ".2f"}, {field: "usd", title: "Cumulative", format: "$.2f"}]}}, {actions: false});

const spark = series => {
  const w = 96, h = 24, lo = Math.min(...series), hi = Math.max(...series), span = hi - lo || 1;
  const pts = series.map((v, i) => [series.length > 1 ? i / (series.length - 1) * w : w / 2, h - 2 - (v - lo) / span * (h - 4)]);
  const [lx, ly] = pts.at(-1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--keep)" stroke-width="1.5"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="var(--keep)"/></svg>`;
};
document.getElementById('dimensions').innerHTML = `
  <tr><th>Dimension</th><th class="num">Baseline</th><th class="num">Current</th><th class="num">Change</th><th class="num">Margin</th><th>Kept iterations</th></tr>
  ${data.dimensions.map(d => `<tr><td>${esc(d.name)}</td><td class="num">${f(d.baseline, 1)}</td><td class="num">${f(d.current, 1)}</td>
    <td class="num ${trend(d.delta)}">${signed(d.delta)}</td><td class="num">${d.margin}</td><td>${spark(d.series)}</td></tr>`).join('')}`;

const deltas = r => r.deltas ? Object.entries(r.deltas).filter(([, v]) => v !== 0)
  .map(([k, v]) => `<div class="deltas">${esc(k)} <span class="${trend(v)}">${signed(v)}</span></div>`).join('') || '<span class="focus">no change</span>' : '';
const note = (k, v) => v ? `<p><span class="k">${k}</span>${esc(v)}</p>` : '';
const link = (label, href) => href ? `<div><a href="${esc(href)}">${label}</a></div>` : '';
document.getElementById('iterations').innerHTML = `
  <tr><th class="num">#</th><th>Outcome</th><th class="num">Overall</th><th>Changes vs kept</th><th>Plan, decision and learning</th><th>Files</th></tr>
  ${[...data.rows].reverse().map(r => `<tr>
    <td class="num">${r.iteration}</td>
    <td><span class="pill" style="background:${colour(r.outcome)}">${esc(r.outcome)}</span>${r.dryRun ? '<div><span class="tag">dry run</span></div>' : ''}
      ${r.focus.length ? `<div class="focus" style="margin-top:6px">${esc(r.focus.join(', '))}</div>` : ''}</td>
    <td class="num">${f(r.overall)}</td>
    <td>${deltas(r)}</td>
    <td class="notes">${note('Reason', r.reason)}${note('Decision', r.decision.join('; '))}${note('Learning', r.learning)}</td>
    <td>${link('patch', r.patch)}${link('run', r.run)}</td></tr>`).join('') || '<tr><td colspan="6" class="focus">No iterations yet.</td></tr>'}`;

if (data.retro) {
  const r = data.retro;
  document.getElementById('retro').hidden = false;
  document.getElementById('retro-meta').innerHTML = [
    ['Commits', `<code>${esc(r.base.slice(0, 8))}..${esc(r.head.slice(0, 8))}</code>`], ['Written', esc(when(r.at))],
    ['Tests changed', esc(r.changedTests.join(', ') || 'none')]
  ].map(([k, v]) => `<span><b>${k}:</b> ${v}</span>`).join('');
  document.getElementById('retro-summary').textContent = r.summary;
  const tone = {high: '--rejected', medium: '--gated', low: '--discard', good: '--keep', questionable: '--gated', bad: '--rejected'};
  const pill = v => `<span class="pill" style="background:${css(tone[v])}">${esc(v)}</span>`;
  const groups = [
    ['Behaviour changes', r.behaviourChanges, i => `${pill(i.severity)}<div class="focus" style="margin-top:6px">${i.caughtByTests ? 'caught by tests' : 'not caught by tests'}</div>`,
      i => note('Evidence', i.evidence) + note('Iterations', i.iterations.join(', ')) + note('Proposed test', i.proposedTest)],
    ['Patterns', r.patterns, i => pill(i.verdict), i => note('Evidence', i.evidence)],
    ['Test gaps', r.testGaps, () => '', i => note('Proposed test', i.proposedTest)],
    ['Other', r.other, () => '', () => '']];
  document.getElementById('retro-items').innerHTML = `
    <tr><th>Code</th><th>Kind</th><th>Finding</th></tr>
    ${groups.flatMap(([kind, items, badge, extra]) => items.map(i => `<tr>
      <td><b>${esc(i.code)}</b></td><td>${kind}${badge(i) ? `<div style="margin-top:4px">${badge(i)}</div>` : ''}</td>
      <td class="notes"><p><b>${esc(i.title)}</b></p><p>${esc(i.detail)}</p>${extra(i)}</td></tr>`)).join('')}`;
}
</script>
</body>
</html>

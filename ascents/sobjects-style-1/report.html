<style>
:root{--surface:#fcfcfb;--text:#0b0b0b;--muted:#52514e;--grid:#e6e5e0;--keep:#2a78d6;--discard:#8f8e89;--gated:#c26a1b;--rejected:#b8433a;--nochange:#b5b4ae;--error:#8e2a8e;--up:#1f7a3d;--down:#b8433a}
@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--text:#fff;--muted:#c3c2b7;--grid:#383835;--keep:#3987e5;--discard:#8f8e89;--gated:#e08a3c;--rejected:#e0675d;--nochange:#5e5d59;--error:#c565c5;--up:#4cc176;--down:#e0675d}}
body{margin:0;padding:24px 16px;background:var(--surface);color:var(--text);font:14px/1.4 system-ui,sans-serif}
main{max-width:1280px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 16px}
.meta b{color:var(--text);font-weight:600}
code{font:12px ui-monospace,monospace}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:24px}
.card{border:1px solid var(--grid);border-radius:10px;padding:14px 16px;display:flex;gap:16px;align-items:center}
.card svg.graphic{flex:none}
.card > div{min-width:0}
.card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.card .big{font-size:28px;font-weight:600;line-height:1.1}
.card .sub{color:var(--muted);font-size:13px;margin-top:4px}
.card .row{margin-top:4px;font-size:13px}
.card .row svg{vertical-align:-3px;margin-right:6px;color:var(--muted)}
.card .row svg[width="10"]{vertical-align:-1px}
h2{font-size:14px;color:var(--muted);font-weight:600;margin:28px 0 8px}
.chart{width:100%}
.empty{color:var(--muted);padding:32px 16px;text-align:center;border:1px dashed var(--grid);border-radius:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--muted);font-weight:600;text-align:left;font-size:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
.tag{display:inline-block;margin-top:4px;padding:0 6px;border:1px solid var(--grid);border-radius:4px;font-size:11px;color:var(--muted)}
.focus{color:var(--muted);font-size:12px}
.notes p{margin:0 0 6px}.notes p:last-child{margin:0}
.notes .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.deltas{white-space:nowrap}
a{color:var(--keep)}
.refresh{position:fixed;top:12px;right:16px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;background:var(--surface);padding:2px 6px;border-radius:6px}
</style>
</head>
<body><main>
<label class="refresh"><input type="checkbox" id="refresh"> Refresh every minute</label>
<script>
// The setting lives in the query string so it survives the reload, including from a file:// URL.
{
  const box = document.getElementById('refresh');
  box.checked = new URLSearchParams(location.search).get('refresh') !== 'off';
  if (box.checked) setTimeout(() => location.reload(), 60000);
  box.onchange = () => { location.search = box.checked ? '' : '?refresh=off'; };
}
</script>

08:11:39.881Z","outcome":"keep","dryRun":false,"overall":88.9,"current":88.9,"hours":0.064,"minutes":2.1,"focus":["PMD"],"reason":"PMD scores 42.4 because of 16 findings in fflib_SObjects.cls. 15 are OneDeclarationPerLine from loop headers `for (Integer i = 0, j = records.size(); i \u003c j; i++)`, where i is only used to read records[i], so each converts to a for-each loop with identical behaviour. The 16th is EagerlyLoadedDescribeSObjectResult at line 55, fixed by deferring the describe; nothing reads child relationships from sObjectDescribe, and getSObjectType() is unaffected. This clears every PMD finding without suppressions, and the for-each form may also slightly reduce CPU in the bulk headroom test.","decision":["every focus dimension rose by more than its margin and no other dimension fell by more than its margin"],"learning":"Behaviour-preserving syntactic rewrites (for-each over indexed loops, deferred describe options) can clear all findings of a PMD rule family in one edit and move only PMD, with at most small noise-level effects on headroom or efficiency, so batching every instance of one rule per iteration is efficient.","deltas":{"PMD":57.6,"Graph Engine":0,"Tests passing":0,"Code coverage":0,"Test run time":-0.2,"Limit headroom":1.5,"Resource efficiency":-0.5},"patch":"patches/1.patch","run":"runs/1","cost":{"plan":0.3095158,"implement":0.17375859999999999,"learn":0.0727647}},{"iteration":2,"at":"2026-11-14T08:13:44.800Z","outcome":"discard","dryRun":false,"overall":88.5,"current":88.9,"hours":0.101,"minutes":2.3,"focus":["Limit headroom"],"reason":"Limit headroom is 58.8 because headroomBulkFieldOperations uses 41.2% of the CPU limit. The four blank-check methods it calls every round (getRecordsWithBlankFieldValues, getRecordsWithAllBlankFieldValues, getRecordsWithNotBlankFieldValues, getRecordsWithAllNotBlankFieldValues) rebuild a Set iterator for every record and call String.valueOf plus String.isBlank/isNotBlank for every field, even when the value is null. Copying the Set to a List once per call and checking for null first (null is already blank, as the existing tests show) gives identical results with fewer iterator allocations and system calls in the hot loop.","decision":["Limit headroom is a focus but rose -1.5, not more than its margin 7.5"],"learning":"Hoisting a Set→List copy and adding a null short-circuit before String.valueOf/isBlank in the blank-check loops did not reduce CPU (headroom slightly worse, nothing else moved), so those system calls and iterator costs are not what dominates headroomBulkFieldOperations; the remaining cost is likely record.get(field) and per-record work, so further inner-loop micro-tweaks in these methods are low-yield.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":0,"Test run time":-0.3,"Limit headroom":-1.5,"Resource efficiency":-0.9},"patch":"patches/2.patch","run":"runs/2","cost":{"plan":0.40966359999999996,"implement":0.1525556,"learn":0.0632727}},{"iteration":3,"at":"2026-11-14T08:15:59.954Z","outcome":"discard","dryRun":false,"overall":88.8,"current":88.9,"hours":0.147,"minutes":2.7,"focus":["Limit headroom"],"reason":"Limit headroom is 58.8 because headroomBulkFieldOperations uses 41.2% of the CPU limit across 80 rounds of 200-record loops. Iteration #2 showed the blank-check inner loops are not the main cost, so this targets per-record overhead in the other hot loops. It removes per-record safe-navigation in getRecordsByFieldValues and setFieldValueByMap (a null collection still throws NullPointerException on the first record, as it did before). It replaces containsKey followed by get with one get in setFieldValueByMap, falling back to containsKey only when the value is null, so keys mapped to null are still written. It hoists the leaf field name out of the per-record loop in getParentIdFieldValues. Each change keeps results identical and removes a system operation from every record visit.","decision":["re-measured a close discard and averaged the noisy dimensions over 2 runs (first run {\"PMD\":100,\"Graph Engine\":100,\"Tests passing\":100,\"Code coverage\":100,\"Test run time\":81.5,\"Limit headroom\":59.9,\"Resource efficiency\":81.3})","Limit headroom is a focus but rose -1.3, not more than its margin 7.5"],"learning":"Removing per-record safe-navigation, a duplicate map lookup, and an index read did not measurably move Limit headroom; the cost is the unavoidable record.get/put/contains platform calls, so only changes that eliminate whole calls or record visits can beat the noise margin.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":0,"Test run time":0.2,"Limit headroom":-1.3,"Resource efficiency":0.3},"patch":"patches/3.patch","run":"runs/3","cost":{"plan":0.44860179999999994,"implement":0.1309549,"learn":0.059640700000000005}},{"iteration":4,"at":"2026-11-14T08:18:43.482Z","outcome":"discard","dryRun":false,"overall":88.4,"current":88.9,"hours":0.194,"minutes":2.9,"focus":["Resource efficiency"],"reason":"Resource efficiency (81.8) is set by fflib_SObjectDomainTest using 37.7% of the CPU limit. Its headroomBulkTriggerDispatch makes 105 rounds × 3 triggerHandler calls, and each one builds a domain through fflib_SObjects(records, sObjectType), which calls sObjectType.getDescribe(DEFERRED) every time. Only fflib_SObjectDomain's before-phase CRUD checks read SObjectDescribe; getSObjectType() and every fflib_SObjects method can use the token directly. Storing the token and describing lazily on first read of sObjectDescribe removes a whole describe call from every construction that never needs it. Results are unchanged: sObjectDescribe returns the same DescribeSObjectResult when read, and getSObjectType() returns the same token. Unlike the discarded micro-tweaks, this removes a whole platform call per construction.","decision":["re-measured a close discard and averaged the noisy dimensions over 2 runs (first run {\"PMD\":100,\"Graph Engine\":100,\"Tests passing\":100,\"Code coverage\":100,\"Test run time\":81.6,\"Limit headroom\":54.8,\"Resource efficiency\":81.9})","Resource efficiency is a focus but rose -0.9, not more than its margin 1.5"],"learning":"Deferring the SObjectDescribe call to first read did not lower the CPU used by the bulk trigger-dispatch test (Resource efficiency didn't improve beyond noise), which suggests getDescribe(DEFERRED) is already cheap and the CPU goes to dispatch and handler work; target that path, not describe construction.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":0,"Test run time":-0.1,"Limit headroom":-2.7,"Resource efficiency":-0.9},"patch":"patches/4.patch","run":"runs/4","cost":{"plan":0.6825264,"implement":0.12116310000000002,"learn":0.0608607}}],"retro":{"ascent":"sobjects-style-1","at":"2026-11-14T08:22:32.568Z","base":"565e18ee28b5a93aa8deb4037e2eb6a9d2792176","head":"04e420b28542d951ff3881d31a07f1e0ee6655a0","changedTests":[],"step":{"model":"claude-opus-5-5","durationMs":52485,"costUsd":0.4457932},"summary":"Only iteration 1 was kept. It turned 15 indexed loops in fflib_SObjects.cls into for-each loops and made the constructor's describe DEFERRED, which took PMD from 42.4 to 100 with no suppressions. Limit headroom (-1.0) and Resource efficiency (-1.0) fell slightly, within noise, so the expected CPU gain did not happen. Iterations 2-4 targeted CPU, none beat its noise margin, and all were discarded. Behaviour is unchanged on every tested path; the remaining differences are edge cases no test runs: a list modified during a loop, and the deferred describe exposed through a public property.","behaviourChanges":[{"code":"B1","title":"For-each loops throw if the record list is modified during iteration","detail":"The old loops cached the size in j and read records[i], so if a callee added to or removed from the list behind getRecords() mid-loop, the loop still finished (it skipped appended items or failed with an out-of-bounds error on removal). Apex for-each throws System.FinalException 'Cannot modify a collection while it is being iterated' instead. Library code never mutates the list inside these loops. A subclass could, though: it can override getRecords() to return a shared list, or override the virtual hooks such as error() or the addError overloads to touch domain records. Element order and null elements behave the same as before.","evidence":"fflib_SObjects.cls:97,111,132,199,223,261,280,313,346,369,408,430,456,473,498","iterations":[1],"severity":"low","caughtByTests":false,"proposedTest":"In fflib_SObjectsTest, write a subclass whose getRecords() returns a shared list and whose error() override appends a record to that list. Call addError('x') and assert the outcome you want (either an explicit FinalException or a successful finish), so this behaviour is pinned down."},{"code":"B2","title":"Public sObjectDescribe now holds a deferred DescribeSObjectResult","detail":"sObjectDescribe is a public @NamespaceAccessible property, and it now holds a result created with SObjectDescribeOptions.DEFERRED. Child relationships load on first access instead of up front. Subscribers and subclasses that call getChildRelationships() still get the same data, but the describe cost moves to that first call. Identity or equality comparisons against a default getDescribe() result are not guaranteed to hold. Inside the repo, only fflib_SObjectDomain reads it (isCreateable/isUpdateable/isDeletable/isUndeletable/getName at fflib_SObjectDomain.cls:252-299) plus getSObjectType(), and none of these depend on the option.","evidence":"fflib_SObjects.cls:32,55-57,86; fflib_SObjectDomain.cls:252-299","iterations":[1],"severity":"low","caughtByTests":false,"proposedTest":"Construct fflib_SObjects(new List\u003cAccount>(), Account.SObjectType) and assert that sObjectDescribe.getChildRelationships() is non-empty and matches Account.SObjectType.getDescribe().getChildRelationships().size(). Also assert that getSObjectType() == Account.SObjectType."}],"patterns":[{"code":"P1","title":"Indexed loops with comma declarations replaced by for-each","detail":"Cleaner and idiomatic. It clears OneDeclarationPerLine without suppressions. The loop variable names (record/current) match the old locals, which keeps the diff minimal.","evidence":"fflib_SObjects.cls:97-500, iteration 1","verdict":"good"},{"code":"P2","title":"DEFERRED describe in the domain constructor","detail":"It clears EagerlyLoadedDescribeSObjectResult and costs nothing on the paths the library uses. It did not lower CPU, and iteration 4 found the describe call is already cheap.","evidence":"fflib_SObjects.cls:55-57, iterations 1 and 4","verdict":"good"},{"code":"P3","title":"Discarding the micro-optimisations","detail":"Iterations 2 and 3 would have added null short-circuits, Set-to-List copies, and a get-then-containsKey rewrite of setFieldValueByMap. Iteration 4 would have added a lazy describe property and a duplicate state field. Each added complexity or a subtle change to null handling for no measured gain, and discarding them kept the class simpler.","evidence":"iterations 2, 3, 4","verdict":"good"}],"testGaps":[{"code":"T1","title":"CRUD-denied paths of fflib_SObjectDomain on the deferred describe","detail":"The trigger CRUD checks read SObjectDescribe.isCreateable()/getName() and so on. It is not clear the tests cover the denied branch as a user without object permission.","proposedTest":"Use System.runAs with a Minimum Access user and EnforcingTriggerCRUDSecurity enabled. Call handleBeforeInsert/Update/Delete/Undelete and assert a DomainException whose message contains the object name."},{"code":"T2","title":"Mutating the list during iteration","detail":"Nothing tests a callee that modifies the record list during addError, clearFields or setFieldValue.","proposedTest":"See the first behaviour change: a subclass whose override appends to the shared list during addError, with the expected outcome asserted."},{"code":"T3","title":"Null element in the records list","detail":"The old and new loops both throw NullPointerException on a null element, but no test pins this down.","proposedTest":"new fflib_SObjects(new List\u003cAccount>{ null }, Account.SObjectType).getIdFieldValues(Account.Id) should throw NullPointerException."}],"other":[{"code":"X1","title":"Baseline aggregate scores don't match the per-test values","detail":"Each dimension has only one contributor, so the score should equal its per-test value. The baseline reports Limit headroom 57.3 against a per-test 59.8, and Resource efficiency 82.3 against a per-test 82.8. The evolved scores match their per-test values. This suggests the baseline aggregates come from a different run, which makes the reported deltas less reliable."},{"code":"X2","title":"CPU in the headroom test is dominated by platform calls","detail":"Iterations 2-4 found that the cost is in record.get/put/contains and in dispatch work, not in loop form or describe calls. Further headroom gains would mean making fewer calls or visiting fewer records, which the current API contract may not allow."}]}};

  const r = 26, point = t => `${28 + r * Math.sin(t * 2 * Math.PI)} ${28 - r * Math.cos(t * 2 * Math.PI)}`;
  let from = 0;
  const slices = costShares.filter(([, , share]) => share > 0).map(([step, , share]) => {
    const path = share >= 1
      ? `<circle cx="28" cy="28" r="${r}" fill="var(${STEP_COLOURS[step]})"/>`
      : `<path d="M28 28 L${point(from)} A${r} ${r} 0 ${share > 0.5 ? 1 : 0} 1 ${point(from + share)} Z" fill="var(${STEP_COLOURS[step]})" stroke="var(--surface)" stroke-width="1.5"/>`;
    from += share;
    return path;
  });
  return `<svg class="graphic" width="56" height="56" viewBox="0 0 56 56">
    ${slices.length ? slices.join('') : `<circle cx="28" cy="28" r="${r}" fill="var(--grid)"/>`}</svg>`;})();
document.getElementById('tiles').innerHTML = `
  <div class="card">${scoreBar}<div>
    <div class="label">${icons.target} Gain on baseline</div>
    <div class="big">${signed(s.gain)} <span style="font-size:16px;color:var(--muted)">pts</span></div>
    <div class="row">${s.gain >= 0 ? icons.up : icons.down}Current <b>${f(s.current)}</b> from ${f(s.baseline)} baseline</div></div></div>
  <div class="card">${gauge}<div>
    <div class="label">${icons.trend} Climb angle</div>
    <div class="big">${f(s.angle, 1)}°</div>
    <div class="sub">45° is one point an iteration</div>
    <div class="row"><b>${f(s.perHour)}</b> pts/hour · <b>${f(s.perIteration)}</b> pts/iteration</div></div></div>
  <div class="card">${ring}<div>
    <div class="label">${icons.check} Kept</div>
    <div class="big">${s.kept} <span style="font-size:16px;color:var(--muted)">of ${s.iterations}</span></div>
    <div class="row">${icons.clock}<b>${f(s.hours, 1)}</b> hours</div>
    <div class="row">${icons.flask}<b>${f(s.minutesPerIteration, 1)}</b> min/iteration</div></div></div>
  <div class="card">${pie}<div>
    <div class="label">${icons.coin} Total cost</div>
    <div class="big">$${f(data.cost.total)}</div>
    ${costShares.map(([step, v, share]) => `<div class="row"><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="var(${STEP_COLOURS[step]})"/></svg>${step} <b>$${f(v)}</b> · ${Math.round(share * 100)}%</div>`).join('')}</div></div>`;

const climb = data.rows.filter(r => !r.dryRun);
const scored = climb.filter(r => r.overall != null);
const unscored = climb.filter(r => r.overall == null);
const steps = [{hours: 0, current: s.baseline}].concat(climb.map(r => ({hours: r.hours, current: r.current})));
const config = {background: css('--surface'), view: {stroke: null},
  axis: {labelColor: css('--muted'), titleColor: css('--muted'), gridColor: css('--grid'), domainColor: css('--grid'), tickColor: css('--grid')},
  legend: {labelColor: css('--text'), titleColor: css('--muted')}};
const outcome = {field: 'outcome', title: 'Outcome', scale: {domain: OUTCOMES, range: OUTCOMES.map(colour)}};
const tip = [{field: 'iteration', title: 'Iteration'}, {field: 'outcome', title: 'Outcome'},
  {field: 'overall', title: 'Score', format: '.2f'}, {field: 'current', title: 'Current kept', format: '.2f'},
  {field: 'hours', title: 'Hours', format: '.2f'}, {field: 'minutes', title: 'Minutes', format: '.1f'},
  {field: 'focusText', title: 'Focus'}, {field: 'reason', title: 'Reason'}];
const withFocus = rows => rows.map(r => ({...r, focusText: r.focus.join(', ')}));
const lastHours = Math.max(s.hours, ...climb.map(r => r.hours));
const fiveMinutes = Array.from({length: Math.max(1, Math.ceil(lastHours * 12)) + 1}, (_, i) => i / 12);
const minutes = 'round(datum.value * 60)';
const waiting = id => { document.getElementById(id).innerHTML = '<div class="empty">No iterations yet. This chart fills in after the first one finishes.</div>'; };
const hoursAxis = {field: 'hours', type: 'quantitative', title: 'Time since baseline (h:mm)',
  scale: {domain: [0, fiveMinutes.at(-1)], nice: false},
  axis: {values: fiveMinutes, labelExpr: `${minutes} % 15 ? '' : floor(${minutes} / 60) + ':' + pad(${minutes} % 60, 2, '0', 'left')`}};
const ends = steps.length > 1 && steps.at(-1).current.toFixed(1) !== steps[0].current.toFixed(1)
  ? [[steps[0], 'left'], [steps.at(-1), 'right']] : [[steps.at(-1), 'left']];
vegaEmbed('#climb', {$schema: 'https://vega.github.io/schema/vega-lite/5.json', config,
  vconcat: [
    {width: 'container', height: 320, layer: [
      {data: {values: steps}, mark: {type: 'line', interpolate: 'step-after', strokeWidth: 2, color: css('--keep')},
       encoding: {x: {...hoursAxis, axis: {...hoursAxis.axis, title: null, labels: false}}, y: {field: 'current', type: 'quantitative', title: 'Overall score', scale: {zero: false}}}},
      {data: {values: s.fit}, mark: {type: 'line', strokeDash: [6, 4], strokeWidth: 2, color: css('--muted'), opacity: 0.3},
       encoding: {x: {field: 'hours', type: 'quantitative'}, y: {field: 'fit', type: 'quantitative'}}},
      ...ends.map(([step, align]) => (
       {data: {values: [step]}, mark: {type: 'text', align, baseline: 'bottom', dy: -6, fontSize: 28, fontWeight: 600, color: css('--text')},
        encoding: {x: {field: 'hours', type: 'quantitative'}, y: {field: 'current', type: 'quantitative'}, text: {field: 'current', format: '.1f'}}})),
      {data: {values: withFocus(scored)}, mark: {type: 'point', size: 90, strokeWidth: 2, opacity: 1},
       encoding: {x: {field: 'hours', type: 'quantitative'}, y: {field: 'overall', type: 'quantitative'},
                  color: outcome, shape: {field: 'outcome', legend: null},
                  fill: {condition: {test: "datum.outcome === 'keep'", value: css('--keep')}, value: css('--surface')},
                  tooltip: tip}}]},
    {width: 'container', height: 60, data: {values: withFocus(unscored)}, mark: {type: 'tick', thickness: 2, size: 14},
     encoding: {x: hoursAxis, y: {field: 'outcome', type: 'nominal', title: null, scale: {domain: ['gated', 'rejected', 'no-change', 'error']}},
                color: {...outcome, legend: null}, tooltip: tip}}
  ], resolve: {scale: {x: 'shared'}}}, {actions: false});
const timed = climb.filter(r => r.minutes != null);
if (!timed.length) waiting('durations');
else vegaEmbed('#durations', {$schema: 'https://vega.github.io/schema/vega-lite/5.json', width: 'container', height: 200, config,
  data: {values: withFocus(timed)},
  mark: {type: 'bar', cornerRadiusTopLeft: 4, cornerRadiusTopRight: 4, width: {expr: "min(40, bandwidth('x') * 0.8)"}},
  encoding: {x: {field: 'iteration', type: 'ordinal', title: 'Iteration', axis: {labelAngle: 0}},
             y: {field: 'minutes', type: 'quantitative', title: 'Minutes'},
             color: outcome, tooltip: tip}}, {actions: false});

const usd = x => `$${x.toFixed(2)}`;
document.getElementById("cost-title").textContent =
  `Cumulative agent cost by step: ${usd(data.cost.total)} total (${Object.entries(data.cost.byStep).map(([k, v]) => `${k} ${usd(v)}`).join(", ")}), estimated at list price`;
const byCost = Object.entries(data.cost.byStep).sort(([, a], [, b]) => b - a).map(([step]) => step);
if (!data.rows.length) waiting("cost");
else vegaEmbed("#cost", {$schema: "https://vega.github.io/schema/vega-lite/5.json", width: "container", height: 240, config,
  data: {values: data.cost.series.map(p => ({...p, rank: byCost.indexOf(p.step)}))},
  mark: {type: "area", line: {strokeWidth: 2}, opacity: 0.25},
  encoding: {x: hoursAxis,
             y: {field: "usd", type: "quantitative", stack: "zero", title: "Cumulative cost (USD)", axis: {format: "$.2f"}},
             color: {field: "step", title: "Step", scale: {domain: [...byCost].reverse(), range: [...byCost].reverse().map(step => css(STEP_COLOURS[step]))}},
             order: {field: "rank"},
             tooltip: [{field: "step", title: "Step"}, {field: "hours", title: "Hours", format: ".2f"}, {field: "usd", title: "Cumulative", format: "$.2f"}]}}, {actions: false});

const spark = series => {
  const w = 96, h = 24, lo = Math.min(...series), hi = Math.max(...series), span = hi - lo || 1;
  const pts = series.map((v, i) => [series.length > 1 ? i / (series.length - 1) * w : w / 2, h - 2 - (v - lo) / span * (h - 4)]);
  const [lx, ly] = pts.at(-1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--keep)" stroke-width="1.5"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="var(--keep)"/></svg>`;
};
document.getElementById('dimensions').innerHTML = `
  <tr><th>Dimension</th><th class="num">Baseline</th><th class="num">Current</th><th class="num">Change</th><th class="num">Margin</th><th>Kept iterations</th></tr>
  ${data.dimensions.map(d => `<tr><td>${esc(d.name)}</td><td class="num">${f(d.baseline, 1)}</td><td class="num">${f(d.current, 1)}</td>
    <td class="num ${trend(d.delta)}">${signed(d.delta)}</td><td class="num">${d.margin}</td><td>${spark(d.series)}</td></tr>`).join('')}`;

const deltas = r => r.deltas ? Object.entries(r.deltas).filter(([, v]) => v !== 0)
  .map(([k, v]) => `<div class="deltas">${esc(k)} <span class="${trend(v)}">${signed(v)}</span></div>`).join('') || '<span class="focus">no change</span>' : '';
const note = (k, v) => v ? `<p><span class="k">${k}</span>${esc(v)}</p>` : '';
const link = (label, href) => href ? `<div><a href="${esc(href)}">${label}</a></div>` : '';
document.getElementById('iterations').innerHTML = `
  <tr><th class="num">#</th><th>Outcome</th><th class="num">Overall</th><th>Changes vs kept</th><th>Plan, decision and learning</th><th>Files</th></tr>
  ${[...data.rows].reverse().map(r => `<tr>
    <td class="num">${r.iteration}</td>
    <td><span class="pill" style="background:${colour(r.outcome)}">${esc(r.outcome)}</span>${r.dryRun ? '<div><span class="tag">dry run</span></div>' : ''}
      ${r.focus.length ? `<div class="focus" style="margin-top:6px">${esc(r.focus.join(', '))}</div>` : ''}</td>
    <td class="num">${f(r.overall)}</td>
    <td>${deltas(r)}</td>
    <td class="notes">${note('Reason', r.reason)}${note('Decision', r.decision.join('; '))}${note('Learning', r.learning)}</td>
    <td>${link('patch', r.patch)}${link('run', r.run)}</td></tr>`).join('') || '<tr><td colspan="6" class="focus">No iterations yet.</td></tr>'}`;

if (data.retro) {
  const r = data.retro;
  document.getElementById('retro').hidden = false;
  document.getElementById('retro-meta').innerHTML = [
    ['Commits', `<code>${esc(r.base.slice(0, 8))}..${esc(r.head.slice(0, 8))}</code>`], ['Written', esc(when(r.at))],
    ['Tests changed', esc(r.changedTests.join(', ') || 'none')]
  ].map(([k, v]) => `<span><b>${k}:</b> ${v}</span>`).join('');
  document.getElementById('retro-summary').textContent = r.summary;
  const tone = {high: '--rejected', medium: '--gated', low: '--discard', good: '--keep', questionable: '--gated', bad: '--rejected'};
  const pill = v => `<span class="pill" style="background:${css(tone[v])}">${esc(v)}</span>`;
  const groups = [
    ['Behaviour changes', r.behaviourChanges, i => `${pill(i.severity)}<div class="focus" style="margin-top:6px">${i.caughtByTests ? 'caught by tests' : 'not caught by tests'}</div>`,
      i => note('Evidence', i.evidence) + note('Iterations', i.iterations.join(', ')) + note('Proposed test', i.proposedTest)],
    ['Patterns', r.patterns, i => pill(i.verdict), i => note('Evidence', i.evidence)],
    ['Test gaps', r.testGaps, () => '', i => note('Proposed test', i.proposedTest)],
    ['Other', r.other, () => '', () => '']];
  document.getElementById('retro-items').innerHTML = `
    <tr><th>Code</th><th>Kind</th><th>Finding</th></tr>
    ${groups.flatMap(([kind, items, badge, extra]) => items.map(i => `<tr>
      <td><b>${esc(i.code)}</b></td><td>${kind}${badge(i) ? `<div style="margin-top:4px">${badge(i)}</div>` : ''}</td>
      <td class="notes"><p><b>${esc(i.title)}</b></p><p>${esc(i.detail)}</p>${extra(i)}</td></tr>`)).join('')}`;
}
</script>
</body>
</html>

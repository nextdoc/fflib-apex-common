<style>
:root{--surface:#fcfcfb;--text:#0b0b0b;--muted:#52514e;--grid:#e6e5e0;--keep:#2a78d6;--discard:#8f8e89;--gated:#c26a1b;--rejected:#b8433a;--nochange:#b5b4ae;--error:#8e2a8e;--up:#1f7a3d;--down:#b8433a}
@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--text:#fff;--muted:#c3c2b7;--grid:#383835;--keep:#3987e5;--discard:#8f8e89;--gated:#e08a3c;--rejected:#e0675d;--nochange:#5e5d59;--error:#c565c5;--up:#4cc176;--down:#e0675d}}
body{margin:0;padding:24px 16px;background:var(--surface);color:var(--text);font:14px/1.4 system-ui,sans-serif}
main{max-width:1280px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 16px}
.meta b{color:var(--text);font-weight:600}
code{font:12px ui-monospace,monospace}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-bottom:24px}
.card{border:1px solid var(--grid);border-radius:10px;padding:14px 16px;display:flex;gap:16px;align-items:center}
.card svg.graphic{flex:none}
.card > div{min-width:0}
.card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.card .big{font-size:28px;font-weight:600;line-height:1.1}
.card .sub{color:var(--muted);font-size:13px;margin-top:4px}
.card .row{margin-top:4px;font-size:13px}
.card .row svg{vertical-align:-3px;margin-right:6px;color:var(--muted)}
.card .row svg[width="10"]{vertical-align:-1px}
h2{font-size:14px;color:var(--muted);font-weight:600;margin:28px 0 8px}
.chart{width:100%}
.empty{color:var(--muted);padding:32px 16px;text-align:center;border:1px dashed var(--grid);border-radius:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--muted);font-weight:600;text-align:left;font-size:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;color:#fff;white-space:nowrap}
.tag{display:inline-block;margin-top:4px;padding:0 6px;border:1px solid var(--grid);border-radius:4px;font-size:11px;color:var(--muted)}
.focus{color:var(--muted);font-size:12px}
.notes p{margin:0 0 6px}.notes p:last-child{margin:0}
.notes .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.deltas{white-space:nowrap}
a{color:var(--keep)}
.refresh{position:fixed;top:12px;right:16px;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px;background:var(--surface);padding:2px 6px;border-radius:6px}
</style>
</head>

<label class="refresh"><input type="checkbox" id="refresh"> Refresh every minute</label>
<script>
// The setting lives in the query string so it survives the reload, including from a file:// URL.
{
  const box = document.getElementById('refresh');
  box.checked = new URLSearchParams(location.search).get('refresh') !== 'off';
  if (box.checked) setTimeout(() => location.reload(), 60000);
  box.onchange = () => { location.search = box.checked ? '' : '?refresh=off'; };
}
</script>

g conversion, a dynamic get and a compare. The check cannot change the result: Relationship.resolve() only puts the same Id when already resolved and already skips a blank Id; EmailRelationship.setWhatId sets the same value when resolved and already runs when the Id is blank; RelationshipByExternalId puts the same stored RelationshipObject. So calling resolve() directly gives identical results. Iteration #5 removed ~15k isResolved calls for +5.1, and this removes ~20k more. Removing isResolved from IRelationship and its three classes deletes 3 covered and 1 uncovered line (348/418 = 83.25% vs 83.18% now), so coverage does not fall. Exceptions, DML order and pass structure are unchanged.","decision":["every focus dimension rose by more than its margin and no other dimension fell by more than its margin"],"learning":"CPU-bound Limit headroom responds most to removing redundant per-record work in the hottest loop, such as idempotency guards like isResolved() on ~20k links, rather than to restructuring DML or passes. Deleting such guards also lifts test run time and trims coverage-denominator lines, so look for other same-result checks in per-record loops next.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":0.1,"Test run time":1.8,"Limit headroom":6.2,"Resource efficiency":0},"patch":"patches/11.patch","run":"runs/11","cost":{"plan":0.535434,"implement":0.13271829999999998,"learn":0.0647787}},{"iteration":12,"at":"2026-11-12T09:09:54.868Z","outcome":"discard","dryRun":false,"overall":90.2,"current":90.3,"hours":0.621,"minutes":3.2,"focus":["Limit headroom"],"reason":"Limit headroom (66.2) is capped by CPU at 33.8% in headroomBulkCommitWork. Every link is already resolved by the end of the insert pass, yet updateDmlByType calls Relationships.resolve() again for Opportunity (which has dirty records) and re-runs all ~3,000 Opportunity links (2,000 new-opp links plus 1,000 dirty links), each with an Id-to-String conversion through String.isNotBlank and a dynamic put. Relationship.resolve() also does that String conversion on all ~21,000 calls. If each resolve() reports whether it applied, Relationships can record its size after a pass in which every link resolved and return early on a later pass when no link has been added since. Re-running a fully resolved list only rewrites the same Ids in the same order, so results are identical. Adding a link changes the size and forces a full pass, and any unresolved link means the whole list still runs in original order. Replacing String.isNotBlank(Id) with `!= null` gives the same result for an Id without the String conversion. DML order, exception messages and pass structure are unchanged. Coverage adds about 8 covered lines and 1 uncovered line (about 352/422 = 83.4% vs 83.3%).","decision":["Limit headroom is a focus but rose -1.3, not more than its margin 5"],"learning":"In the ~21k-link resolve loop, headroom improves only by removing per-link operations; adding per-call bookkeeping (Boolean return, && accumulation, size check) to skip a ~3k-link repeat pass costs about as much as it saves and lowered headroom, so avoid 'already resolved' tracking in hot loops.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":0.2,"Test run time":0.5,"Limit headroom":-1.3,"Resource efficiency":0},"patch":"patches/12.patch","run":"runs/12","cost":{"plan":0.6466838000000001,"implement":0.14969,"learn":0.0665247}},{"iteration":13,"at":"2026-11-12T09:13:04.347Z","outcome":"discard","dryRun":false,"overall":90.9,"current":90.3,"hours":0.675,"minutes":3.3,"focus":["Limit headroom"],"reason":"Limit headroom is CPU-bound (33.8%) in headroomBulkCommitWork, and the hottest loop is Relationships.resolve() over ~21k lookup links (~18k in the insert pass plus ~3k Opportunity links in the update pass). Each link costs an interface call to Relationship.resolve(), an Id-to-String conversion in String.isNotBlank(this.RelatedTo.Id), and a second read of RelatedTo.Id. Keeping lookup links in a typed List\u003cRelationship> and resolving them inline (read the Id once into a local, check != null, then put) removes ~21k method calls, ~21k String conversions and ~21k field reads. Iteration #11 gained over 5 points by removing a similar per-link call plus conversion. A non-null Id is never blank, so != null gives the same result as String.isNotBlank. Lookup links still resolve in registration order. Email and external-id links still use their own resolve() through IRelationship. DML order, the passes and exception messages are unchanged. Coverage: 2 covered statements in Relationship.resolve() are removed and about 4 covered statements are added in the inline loop, so coverage rises slightly and cannot fall.","decision":["Limit headroom is a focus but rose 3.9, not more than its margin 5"],"learning":"Inlining the lookup-link resolve loop (no interface call, no Id-to-String conversion, one Id read) gave a real but sub-threshold CPU gain, so per-link micro-savings in Relationships.resolve() are now diminishing after #5 and #11 took the big ones; the remaining cost is the unavoidable put and Id read. Future headroom gains likely need to reduce the number of links or puts processed, or target other hot loops (DML-by-type passes), not shave resolve() further.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":0.1,"Test run time":0.1,"Limit headroom":3.9,"Resource efficiency":0},"patch":"patches/13.patch","run":"runs/13","cost":{"plan":0.734671,"implement":0.14304010000000003,"learn":0.0662287}},{"iteration":14,"at":"2026-11-12T09:16:21.246Z","outcome":"discard","dryRun":false,"overall":89.6,"current":90.3,"hours":0.725,"minutes":3,"focus":["Limit headroom"],"reason":"Limit headroom (66.2) is capped by CPU at 33.8% in headroomBulkCommitWork. Every per-record register path (registerNew ~14k, registerRelationship ~15k, registerDirty 2k, registerDeleted 400) computes the type key with a non-deferred record.getSObjectType().getDescribe().getName(), about 31k times. A non-deferred describe also loads child relationships, but only the name is needed. getDescribe(SObjectDescribeOptions.DEFERRED).getName() returns the same API name and is already what handleRegisterType uses to build the map keys, so keys match exactly. #6 only removed ~12k duplicate calls; this makes all ~31k cheaper without adding helpers, calls or bookkeeping. Statements, exception messages, assert order and DML order are unchanged, so coverage, PMD and tests should not move.","decision":["Limit headroom is a focus but rose -3.6, not more than its margin 5","Code coverage fell 0.2, more than its margin 0"],"learning":"Swapping getDescribe() for getDescribe(DEFERRED) in the ~31k per-record key lookups did not cut CPU and likely made it worse, since a deferred describe probably pays a lazy-load cost on getName(). The reformatting also added uncovered statements. Reduce per-record call counts, or cache the type key per SObjectType, rather than changing describe variants, and avoid edits that add statements.","deltas":{"PMD":0,"Graph Engine":0,"Tests passing":0,"Code coverage":-0.2,"Test run time":-1.5,"Limit headroom":-3.6,"Resource efficiency":0},"patch":"patches/14.patch","run":"runs/14","cost":{"plan":0.6759794000000001,"implement":0.13989130000000002,"learn":0.0713507}}],"retro":{"ascent":"unit-of-work-1","at":"2026-11-12T09:21:26.256Z","base":"550ed4f58db713b02b63aa40b552ddfbcb0d3637","head":"05aea65402bb7e356ca7f2b433ecdafa3df622fa","changedTests":[],"step":{"model":"claude-opus-5-5","durationMs":101153,"costUsd":0.6528502},"summary":"Only fflib_SObjectUnitOfWork.cls changed, so it drove every gain. PMD reached 100 through braces and deferred describes (iteration 1), Limit headroom rose 15.4 from skipping redundant resolve passes and removing isResolved() (iterations 5 and 11), and Code coverage rose 4.1 only by deleting untested statements (iterations 3, 8, 10 and 11), with no new paths tested. Tests passing, Graph Engine and Resource efficiency did not move. The main behaviour risk is in the untested external-id relationship path: resolve() now overwrites a parent reference that is already set, and building and validating that reference moved from commit time to register time.","behaviourChanges":[{"code":"B1","title":"External-id relationship now overwrites an existing parent reference","detail":"The baseline only called putSObject when Record.getSObject(RelationshipName) was null, so a parent reference the caller set, or an earlier registration for the same field, was kept (first wins). Without the isResolved guard, resolve() always writes the reference stored at registration, so the last registration wins and a manual reference is replaced. Resolve runs in the insert, upsert and update passes, so the overwrite repeats.","evidence":"fflib_SObjectUnitOfWork.cls:1037-1040, :1116-1118; baseline RelationshipByExternalId.isResolved","iterations":[11],"severity":"medium","caughtByTests":false,"proposedTest":"Use a mock IDML. Register a Contact as new, register an external-id relationship to Account, then set contact.Account to an Account reference with a different key before commitWork. Assert which reference reaches dmlInsert. Also register the same relationship twice with different ids and assert the first one wins."},{"code":"B2","title":"External-id reference built and filled at register time, not commit time","detail":"relatedObject.newSObject() and put(externalIdField, externalId) now run in Relationships.add. A type-mismatched externalId (for example a String into a number external-id field) throws SObjectException from registerRelationship, outside commitWork's savepoint and onCommitWorkFinished(false), instead of inside the commit. One reference instance is now shared across all resolve passes instead of a fresh one per pass. The new object's type comes from externalIdFieldDescribe.getSObjectType(), which the check just above proves equal to getReferenceTo()[0].","evidence":"fflib_SObjectUnitOfWork.cls:1053-1083","iterations":[8,10],"severity":"low","caughtByTests":false,"proposedTest":"Register an external-id relationship with an externalId of the wrong type. Assert the exception is thrown by registerRelationship (new behaviour) or by commitWork (baseline), and fix the intended contract."},{"code":"B3","title":"Update pass no longer resolves relationships for types without dirty records","detail":"In the baseline the update pass re-resolved every type. A new child whose parent type was registered later got the parent Id written into the in-memory record (never saved, because the child was not dirty). Now that write is skipped unless the child's type has dirty records, so callers that read the child record's lookup field after commitWork may see null where the baseline showed the Id. Saved data is unchanged.","evidence":"fflib_SObjectUnitOfWork.cls:908-920","iterations":[5],"severity":"low","caughtByTests":false,"proposedTest":"Create the UoW with types [Contact, Account], registerNew(contact, Contact.AccountId, account) and registerNew(account), commit with a mock DML that assigns Ids, and assert contact.AccountId after commit."},{"code":"B4","title":"No 'field not queried' exception for dirty records missing the lookup field","detail":"Baseline isResolved() called Record.get(RelatedToField) whenever the parent had an Id. On a SOQL record without that field this throws SObjectException. Evolved code only calls put, so such records now commit successfully.","evidence":"fflib_SObjectUnitOfWork.cls:1121-1131; baseline Relationship.isResolved","iterations":[11],"severity":"low","caughtByTests":false,"proposedTest":"Query an Opportunity without AccountId, call registerDirty(opp, Opportunity.AccountId, existingAccount) and commit; assert there is no exception and AccountId is set."},{"code":"B5","title":"Same Id written again to already-resolved records","detail":"Relationship.resolve() and EmailRelationship.resolve() now run on every pass with no guard. Already-inserted records get the same Id written again in the upsert pass, and in the update pass when their type has dirty records. The result is identical; it only costs CPU proportional to links times passes.","evidence":"fflib_SObjectUnitOfWork.cls:1037-1040","iterations":[11],"severity":"low","caughtByTests":true,"proposedTest":""},{"code":"B6","title":"Single-record permanent delete delegates to the list overload","detail":"registerPermanentlyDeleted(SObject) now wraps the record in a list and calls the list overload, which still calls emptyRecycleBin then registerDeleted. The methods are non-virtual, so a subclass cannot change the dispatch. Behaviour is equivalent, but the single-record path is untested.","evidence":"fflib_SObjectUnitOfWork.cls:737-750","iterations":[10],"severity":"low","caughtByTests":false,"proposedTest":"Call registerPermanentlyDeleted(singleRecord) with a mock DML and assert the record reaches both dmlDelete and emptyRecycleBin."}],"patterns":[{"code":"P1","title":"Brace-wrapping single-statement ifs","detail":"Clears PMD violations with no semantic change.","evidence":"fflib_SObjectUnitOfWork.cls:381-394, 497-501, 542-544, 706-710, 1169-1171; iteration 1","verdict":"good"},{"code":"P2","title":"Mixed DEFERRED and full describes","detail":"Commit-time loops and handleRegisterType use getDescribe(DEFERRED), but every per-record register path still uses the full getDescribe(). Both give the same name, so map keys match, but the inconsistency is confusing. Iteration 14 showed switching the register paths lost headroom. Caching the name per type would be cleaner.","evidence":"fflib_SObjectUnitOfWork.cls:283-286 vs 386, 411, 457, 502, 711, 756","verdict":"questionable"},{"code":"P3","title":"Coverage raised by deleting untested statements","detail":"Coverage rose by shrinking the denominator: locals, fields and statements were removed from the external-id path and the single-record overloads. The untested external-id and publish paths are still untested, so the 83.3% overstates confidence.","evidence":"iterations 3, 8, 10, 11","verdict":"questionable"},{"code":"P4","title":"Shared registerPublish helper","detail":"Removes duplicated code across the three single-record publish methods with no behaviour change.","evidence":"fflib_SObjectUnitOfWork.cls:752-813; iteration 3","verdict":"good"},{"code":"P5","title":"Removing isResolved idempotency guards","detail":"Behaviour-preserving and a real CPU saving for Relationship and EmailRelationship, but it silently changed the first-wins/no-overwrite semantics of RelationshipByExternalId.","evidence":"fflib_SObjectUnitOfWork.cls:1037-1040, 1107-1140; iteration 11","verdict":"questionable"},{"code":"P6","title":"Eager construction of the external-id reference","detail":"Building the reference in add() mainly served coverage. It moves the failure point and reuses a mutable SObject across passes.","evidence":"fflib_SObjectUnitOfWork.cls:1080-1083; iterations 8 and 10","verdict":"questionable"},{"code":"P7","title":"Emptiness guard before resolve in the update pass","detail":"Cheap and clear, and matches the upsert pass, which already checks for records before resolving.","evidence":"fflib_SObjectUnitOfWork.cls:914-919; iteration 5","verdict":"good"}],"testGaps":[{"code":"T1","title":"External-id registerRelationship path is entirely untested","detail":"The NOTE says no standard object has a usable external Id, but the validation branches and the resolve wiring can still be tested.","proposedTest":"Assert each validation message: null relatedToField; Contact.LastName (not a relationship field); Contact.AccountId with Opportunity.Name (wrong object); Contact.AccountId with Account.Name (not an external id). If a test-only custom object with an external-id field can be added, use a mock IDML to assert the Account reference with the external-id value reaches dmlInsert."},{"code":"T2","title":"Overwrite and first-wins semantics of external-id relationships","detail":"Iteration 11 changed these and no test pins them.","proposedTest":"Register two external-id relationships for the same record and field, commit with a mock DML, and assert which external-id value is used."},{"code":"T3","title":"Single-record publish and permanent-delete overloads","detail":"registerPublishBefore/AfterSuccess/AfterFailureTransaction(SObject) and registerPermanentlyDeleted(SObject) are not run by any test.","proposedTest":"Use a mock IDML with a platform-event type: register one event through each single-record method and assert eventPublish receives it in the right phase. For a single record, assert registerPermanentlyDeleted puts it in both the delete and empty-recycle-bin lists."},{"code":"T4","title":"Relationship resolution across type order and passes","detail":"Nothing tests a child type registered before its parent type, or what the records hold in memory after commit.","proposedTest":"Use types [Contact, Account] with a Contact-to-Account relationship and no dirty records. Commit through a mock DML that assigns Ids, then assert contact.AccountId and the contents of the dmlInsert lists."},{"code":"T5","title":"Dirty records queried without the lookup field","detail":"This removed failure mode is not pinned by any test.","proposedTest":"Query an Opportunity without AccountId, call registerDirty(opp, Opportunity.AccountId, account) and commit successfully."}],"other":[{"code":"X1","title":"Headroom may now be limited by something other than CPU in resolve","detail":"Iterations 12 and 13 show per-link savings in Relationships.resolve() are giving less and less. Remaining CPU cost is register-time work (about 31k full getDescribe().getName() calls) and the unavoidable put. A per-SObjectType name cache (iteration 2 bundled one with semantic changes that broke tests) is still worth trying on its own."},{"code":"X2","title":"Reformatting inflated the line count","detail":"The DEFERRED changes were split over 3-4 lines (for example :283-286, :899-     <div class="big">${s.kept} <span style="font-size:16px;color:var(--muted)">of ${s.iterations}</span></div>
    <div class="row">${icons.clock}<b>${f(s.hours, 1)}</b> hours</div>
    <div class="row">${icons.flask}<b>${f(s.minutesPerIteration, 1)}</b> min/iteration</div></div></div>
  <div class="card">${pie}<div>
    <div class="label">${icons.coin} Total cost</div>
    <div class="big">$${f(data.cost.total)}</div>
    ${costShares.map(([step, v, share]) => `<div class="row"><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="var(${STEP_COLOURS[step]})"/></svg>${step} <b>$${f(v)}</b> · ${Math.round(share * 100)}%</div>`).join('')}</div></div>`;

const climb = data.rows.filter(r => !r.dryRun);
const scored = climb.filter(r => r.overall != null);
const unscored = climb.filter(r => r.overall == null);
const steps = [{hours: 0, current: s.baseline}].concat(climb.map(r => ({hours: r.hours, current: r.current})));
const config = {background: css('--surface'), view: {stroke: null},
  axis: {labelColor: css('--muted'), titleColor: css('--muted'), gridColor: css('--grid'), domainColor: css('--grid'), tickColor: css('--grid')},
  legend: {labelColor: css('--text'), titleColor: css('--muted')}};
const outcome = {field: 'outcome', title: 'Outcome', scale: {domain: OUTCOMES, range: OUTCOMES.map(colour)}};
const tip = [{field: 'iteration', title: 'Iteration'}, {field: 'outcome', title: 'Outcome'},
  {field: 'overall', title: 'Score', format: '.2f'}, {field: 'current', title: 'Current kept', format: '.2f'},
  {field: 'hours', title: 'Hours', format: '.2f'}, {field: 'minutes', title: 'Minutes', format: '.1f'},
  {field: 'focusText', title: 'Focus'}, {field: 'reason', title: 'Reason'}];
const withFocus = rows => rows.map(r => ({...r, focusText: r.focus.join(', ')}));
const lastHours = Math.max(s.hours, ...climb.map(r => r.hours));
const fiveMinutes = Array.from({length: Math.max(1, Math.ceil(lastHours * 12)) + 1}, (_, i) => i / 12);
const minutes = 'round(datum.value * 60)';
const waiting = id => { document.getElementById(id).innerHTML = '<div class="empty">No iterations yet. This chart fills in after the first one finishes.</div>'; };
const hoursAxis = {field: 'hours', type: 'quantitative', title: 'Time since baseline (h:mm)',
  scale: {domain: [0, fiveMinutes.at(-1)], nice: false},
  axis: {values: fiveMinutes, labelExpr: `${minutes} % 15 ? '' : floor(${minutes} / 60) + ':' + pad(${minutes} % 60, 2, '0', 'left')`}};
const ends = steps.length > 1 && steps.at(-1).current.toFixed(1) !== steps[0].current.toFixed(1)
  ? [[steps[0], 'left'], [steps.at(-1), 'right']] : [[steps.at(-1), 'left']];
vegaEmbed('#climb', {$schema: 'https://vega.github.io/schema/vega-lite/5.json', config,
  vconcat: [
    {width: 'container', height: 320, layer: [
      {data: {values: steps}, mark: {type: 'line', interpolate: 'step-after', strokeWidth: 2, color: css('--keep')},
       encoding: {x: {...hoursAxis, axis: {...hoursAxis.axis, title: null, labels: false}}, y: {field: 'current', type: 'quantitative', title: 'Overall score', scale: {zero: false}}}},
      {data: {values: s.fit}, mark: {type: 'line', strokeDash: [6, 4], strokeWidth: 2, color: css('--muted'), opacity: 0.3},
       encoding: {x: {field: 'hours', type: 'quantitative'}, y: {field: 'fit', type: 'quantitative'}}},
      ...ends.map(([step, align]) => (
       {data: {values: [step]}, mark: {type: 'text', align, baseline: 'bottom', dy: -6, fontSize: 28, fontWeight: 600, color: css('--text')},
        encoding: {x: {field: 'hours', type: 'quantitative'}, y: {field: 'current', type: 'quantitative'}, text: {field: 'current', format: '.1f'}}})),
      {data: {values: withFocus(scored)}, mark: {type: 'point', size: 90, strokeWidth: 2, opacity: 1},
       encoding: {x: {field: 'hours', type: 'quantitative'}, y: {field: 'overall', type: 'quantitative'},
                  color: outcome, shape: {field: 'outcome', legend: null},
                  fill: {condition: {test: "datum.outcome === 'keep'", value: css('--keep')}, value: css('--surface')},
                  tooltip: tip}}]},
    {width: 'container', height: 60, data: {values: withFocus(unscored)}, mark: {type: 'tick', thickness: 2, size: 14},
     encoding: {x: hoursAxis, y: {field: 'outcome', type: 'nominal', title: null, scale: {domain: ['gated', 'rejected', 'no-change', 'error']}},
                color: {...outcome, legend: null}, tooltip: tip}}
  ], resolve: {scale: {x: 'shared'}}}, {actions: false});
const timed = climb.filter(r => r.minutes != null);
if (!timed.length) waiting('durations');
else vegaEmbed('#durations', {$schema: 'https://vega.github.io/schema/vega-lite/5.json', width: 'container', height: 200, config,
  data: {values: withFocus(timed)},
  mark: {type: 'bar', cornerRadiusTopLeft: 4, cornerRadiusTopRight: 4, width: {expr: "min(40, bandwidth('x') * 0.8)"}},
  encoding: {x: {field: 'iteration', type: 'ordinal', title: 'Iteration', axis: {labelAngle: 0}},
             y: {field: 'minutes', type: 'quantitative', title: 'Minutes'},
             color: outcome, tooltip: tip}}, {actions: false});

const usd = x => `$${x.toFixed(2)}`;
document.getElementById("cost-title").textContent =
  `Cumulative agent cost by step: ${usd(data.cost.total)} total (${Object.entries(data.cost.byStep).map(([k, v]) => `${k} ${usd(v)}`).join(", ")}), estimated at list price`;
const byCost = Object.entries(data.cost.byStep).sort(([, a], [, b]) => b - a).map(([step]) => step);
if (!data.rows.length) waiting("cost");
else vegaEmbed("#cost", {$schema: "https://vega.github.io/schema/vega-lite/5.json", width: "container", height: 240, config,
  data: {values: data.cost.series.map(p => ({...p, rank: byCost.indexOf(p.step)}))},
  mark: {type: "area", line: {strokeWidth: 2}, opacity: 0.25},
  encoding: {x: hoursAxis,
             y: {field: "usd", type: "quantitative", stack: "zero", title: "Cumulative cost (USD)", axis: {format: "$.2f"}},
             color: {field: "step", title: "Step", scale: {domain: [...byCost].reverse(), range: [...byCost].reverse().map(step => css(STEP_COLOURS[step]))}},
             order: {field: "rank"},
             tooltip: [{field: "step", title: "Step"}, {field: "hours", title: "Hours", format: ".2f"}, {field: "usd", title: "Cumulative", format: "$.2f"}]}}, {actions: false});

const spark = series => {
  const w = 96, h = 24, lo = Math.min(...series), hi = Math.max(...series), span = hi - lo || 1;
  const pts = series.map((v, i) => [series.length > 1 ? i / (series.length - 1) * w : w / 2, h - 2 - (v - lo) / span * (h - 4)]);
  const [lx, ly] = pts.at(-1);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--keep)" stroke-width="1.5"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="var(--keep)"/></svg>`;
};
document.getElementById('dimensions').innerHTML = `
  <tr><th>Dimension</th><th class="num">Baseline</th><th class="num">Current</th><th class="num">Change</th><th class="num">Margin</th><th>Kept iterations</th></tr>
  ${data.dimensions.map(d => `<tr><td>${esc(d.name)}</td><td class="num">${f(d.baseline, 1)}</td><td class="num">${f(d.current, 1)}</td>
    <td class="num ${trend(d.delta)}">${signed(d.delta)}</td><td class="num">${d.margin}</td><td>${spark(d.series)}</td></tr>`).join('')}`;

const deltas = r => r.deltas ? Object.entries(r.deltas).filter(([, v]) => v !== 0)
  .map(([k, v]) => `<div class="deltas">${esc(k)} <span class="${trend(v)}">${signed(v)}</span></div>`).join('') || '<span class="focus">no change</span>' : '';
const note = (k, v) => v ? `<p><span class="k">${k}</span>${esc(v)}</p>` : '';
const link = (label, href) => href ? `<div><a href="${esc(href)}">${label}</a></div>` : '';
document.getElementById('iterations').innerHTML = `
  <tr><th class="num">#</th><th>Outcome</th><th class="num">Overall</th><th>Changes vs kept</th><th>Plan, decision and learning</th><th>Files</th></tr>
  ${[...data.rows].reverse().map(r => `<tr>
    <td class="num">${r.iteration}</td>
    <td><span class="pill" style="background:${colour(r.outcome)}">${esc(r.outcome)}</span>${r.dryRun ? '<div><span class="tag">dry run</span></div>' : ''}
      ${r.focus.length ? `<div class="focus" style="margin-top:6px">${esc(r.focus.join(', '))}</div>` : ''}</td>
    <td class="num">${f(r.overall)}</td>
    <td>${deltas(r)}</td>
    <td class="notes">${note('Reason', r.reason)}${note('Decision', r.decision.join('; '))}${note('Learning', r.learning)}</td>
    <td>${link('patch', r.patch)}${link('run', r.run)}</td></tr>`).join('') || '<tr><td colspan="6" class="focus">No iterations yet.</td></tr>'}`;

if (data.retro) {
  const r = data.retro;
  document.getElementById('retro').hidden = false;
  document.getElementById('retro-meta').innerHTML = [
    ['Commits', `<code>${esc(r.base.slice(0, 8))}..${esc(r.head.slice(0, 8))}</code>`], ['Written', esc(when(r.at))],
    ['Tests changed', esc(r.changedTests.join(', ') || 'none')]
  ].map(([k, v]) => `<span><b>${k}:</b> ${v}</span>`).join('');
  document.getElementById('retro-summary').textContent = r.summary;
  const tone = {high: '--rejected', medium: '--gated', low: '--discard', good: '--keep', questionable: '--gated', bad: '--rejected'};
  const pill = v => `<span class="pill" style="background:${css(tone[v])}">${esc(v)}</span>`;
  const groups = [
    ['Behaviour changes', r.behaviourChanges, i => `${pill(i.severity)}<div class="focus" style="margin-top:6px">${i.caughtByTests ? 'caught by tests' : 'not caught by tests'}</div>`,
      i => note('Evidence', i.evidence) + note('Iterations', i.iterations.join(', ')) + note('Proposed test', i.proposedTest)],
    ['Patterns', r.patterns, i => pill(i.verdict), i => note('Evidence', i.evidence)],
    ['Test gaps', r.testGaps, () => '', i => note('Proposed test', i.proposedTest)],
    ['Other', r.other, () => '', () => '']];
  document.getElementById('retro-items').innerHTML = `
    <tr><th>Code</th><th>Kind</th><th>Finding</th></tr>
    ${groups.flatMap(([kind, items, badge, extra]) => items.map(i => `<tr>
      <td><b>${esc(i.code)}</b></td><td>${kind}${badge(i) ? `<div style="margin-top:4px">${badge(i)}</div>` : ''}</td>
      <td class="notes"><p><b>${esc(i.title)}</b></p><p>${esc(i.detail)}</p>${extra(i)}</td></tr>`)).join('')}`;
}
</script>
</body>
</html>
